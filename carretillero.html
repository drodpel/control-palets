<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets - Carretillero</title>
  <link rel="manifest" href="manifest-carretillero.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --purple: #7c3aed;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #ffffff;
      --muted: #e2e8f0;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .user-pill { font-size: 0.98rem; color: #ffffff; font-weight: 900; }
    .btn-top {
      background: #334155;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 9px;
      font-weight: 900;
      font-size: 0.96rem;
      cursor: pointer;
    }
    .tab-btn.activa {
      background: var(--primary);
      border-color: #93c5fd;
      color: #ffffff;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 900; color: var(--muted); font-size: 1.05rem; }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
      margin-bottom: 12px;
    }
    button.action-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.12rem;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
    }
    .error-msg { color: #fca5a5; font-weight: 900; margin-bottom: 10px; min-height: 20px; }
    #network-status {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
    }
    #network-status.offline { background: #d9770633; color: #fbbf24; }
    .seccion-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 8px 0;
    }
    .seccion-titulo-izq {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #lista-carretillero, #lista-completados, #lista-apuntes-opc {
      overflow-anchor: none;
    }

    /* Registro de cola: botón siempre en la esquina inferior derecha */
    .pedido-item {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 9px;
      border-left: 6px solid var(--warning);
    }
    .pedido-item.con-tiempo-futuro {
      border-left-color: var(--purple);
      background: #18132c;
    }
    .pedido-item.completado {
      border-left-color: var(--success);
      opacity: 0.92;
    }
    .pedido-info {
      min-width: 0;
      flex: 1;
    }
    .pedido-titulo {
      font-size: 1.2rem;
      font-weight: 900;
      margin: 3px 0;
      color: #ffffff;
    }
    .pedido-cant-info {
      font-size: 0.96rem;
      color: #93c5fd;
      font-weight: 900;
      margin-top: 3px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 5px;
      margin-right: 5px;
      background: #d9770644;
      color: #fbbf24;
    }
    .badge.listo {
      background: #16a34a44;
      color: #4ade80;
    }
    .badge.tiempo {
      background: #7c3aed55;
      color: #ddd6fe;
    }
    .acciones-carr {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      align-self: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-coger-uno {
      padding: 12px 16px;
      border: none;
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      font-size: 1rem;
      white-space: nowrap;
    }
    .btn-hecho {
      padding: 12px 18px;
      border: none;
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: var(--success);
      font-size: 1rem;
      white-space: nowrap;
    }
    .btn-desmarcar {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: #334155;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    .btn-opc-accion {
      padding: 7px 12px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    /* Tarjetas Apuntes OPC */
    .opc-apunte-item {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 6px solid var(--primary);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .opc-apunte-item.hecho-apunte {
      border-left-color: var(--success);
      opacity: 0.78;
    }
    .opc-titulo-linea {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 3px 0;
    }
    .opc-mat-list {
      margin: 6px 0 4px 0;
      padding-left: 18px;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.96rem;
    }
    .opc-mat-list li {
      margin-bottom: 3px;
    }

    /* Desplegable estilo operaria para añadir material puesto */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.84);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-y: auto;
    }
    .modal-operaria-panel {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .entrada-y-teclado {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    @media (max-width: 640px) {
      .entrada-y-teclado {
        grid-template-columns: 1fr;
      }
    }
    .campos-verticales {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .field label {
      font-size: 13.5px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 0;
    }
    .modal-operaria-panel input,
    .modal-operaria-panel select {
      height: 38px;
      padding: 4px 9px;
      font-size: 15px;
      border-radius: 7px;
      margin-bottom: 0;
    }
    .modal-operaria-panel input.keypad-target-active {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px #60a5fa55;
      background: #0f1c33;
    }
    .st-mp-pt-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 2px;
    }
    .mat-pill {
      padding: 5px 2px;
      font-size: 13px;
      font-weight: 900;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
      cursor: pointer;
      text-align: center;
    }
    .mat-pill.active {
      background: var(--primary);
      border-color: #93c5fd;
    }
    .num-locked-box {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      overflow: hidden;
    }
    .num-locked-box.keypad-box-active,
    .num-locked-box:focus-within {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px #60a5fa55;
      background: #0f1c33;
    }
    .prefijo-fijo {
      padding: 0 0 0 8px;
      font-size: 15px;
      font-weight: 900;
      color: #93c5fd;
      user-select: none;
      flex-shrink: 0;
    }
    .num-locked-box input {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      height: 100%;
      padding: 3px 8px 3px 4px;
      outline: none !important;
      flex: 1;
      min-width: 0;
    }
    .keypad-and-action {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .fixed-numpad {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px;
      user-select: none;
      touch-action: manipulation;
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }
    .num-key {
      aspect-ratio: 1 / 1;
      max-height: 52px;
      width: 100%;
      justify-self: center;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #1e293b;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      touch-action: manipulation;
    }
    .num-key:active {
      background: var(--primary);
      border-color: #93c5fd;
    }
    .num-key.key-del {
      background: #334155;
      color: #fbbf24;
    }
    .num-key.key-clear {
      background: #3f1d24;
      border-color: #7f1d1d;
      color: #fca5a5;
      font-size: 16px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <span id="network-status">● Conectado</span>
      <div id="info-carr" class="user-pill hidden"></div>
    </div>
    <button id="btn-salir" class="btn-top hidden" onclick="cerrarSesion()">Cambiar nombre</button>
  </header>

  <div id="vista-login" class="card">
    <label for="input-nombre">Nombre</label>
    <input type="text" id="input-nombre" autocomplete="name">
    <div id="login-error" class="error-msg"></div>
    <button type="button" class="action-btn" onclick="entrar()">ENTRAR</button>
  </div>

  <div id="vista-cola" class="hidden">
    <div class="tabs-bar">
      <button type="button" id="tab-btn-cola" class="tab-btn activa" onclick="cambiarPestana('cola')">Cola de pedidos</button>
      <button type="button" id="tab-btn-opc" class="tab-btn" onclick="cambiarPestana('opc')">Apuntes OPC</button>
    </div>

    <div id="pestana-cola">
      <div class="seccion-titulo">
        <h3 style="margin:0;">Pendientes</h3>
        <span id="contador-pendientes" style="font-weight:900; color:var(--muted);">0 pendientes</span>
      </div>
      <div id="lista-carretillero"></div>

      <div class="seccion-titulo">
        <h3 style="margin:0;">Completados hoy</h3>
        <span id="contador-completados" style="font-weight:900; color:#4ade80;">0 listos</span>
      </div>
      <div id="lista-completados"></div>
    </div>

    <div id="pestana-opc" class="hidden">
      <div class="seccion-titulo">
        <div class="seccion-titulo-izq">
          <h3 style="margin:0;">OPC recopiladas hoy</h3>
          <button type="button" class="btn-opc-accion" onclick="anadirOpcManualPrompt()">+ Añadir OPC</button>
        </div>
        <span id="contador-apuntes-opc" style="font-weight:900; color:#93c5fd;">0 OPC</span>
      </div>
      <div id="lista-apuntes-opc"></div>
    </div>
  </div>
</div>

<!-- Vista desplegable tipo operaria para añadir material puesto a una OPC -->
<div id="modal-material-puesto" class="modal-backdrop hidden" onclick="cerrarModalSiFondo(event)">
  <div class="modal-operaria-panel">
    <div class="modal-header">
      <strong id="modal-opc-titulo" style="font-size:1.05rem;">Añadir material puesto · OPC</strong>
      <button type="button" class="btn-top" onclick="cerrarModalMaterialPuesto()">Cerrar</button>
    </div>

    <div class="entrada-y-teclado">
      <div class="campos-verticales">
        <div class="field">
          <label for="mp-linea">Línea (opcional)</label>
          <input type="text" id="mp-linea" inputmode="none" pattern="[0-9]*">
        </div>

        <div class="field">
          <label for="mp-opc">OPC</label>
          <input type="text" id="mp-opc" readonly>
        </div>

        <div id="mp-bloque-tipo-material" class="field">
          <label for="mp-select-clase-mat">Tipo de material</label>
          <select id="mp-select-clase-mat" onchange="mpAlCambiarClaseMaterial()">
            <option value=""></option>
            <option value="lámina">lámina</option>
            <option value="interior">interior</option>
            <option value="posicionador">posicionador</option>
            <option value="sin estuchar">sin estuchar</option>
            <option value="sin encelofanar">sin encelofanar</option>
            <option value="estuche">estuche</option>
            <option value="embalaje">embalaje</option>
            <option value="embalaje inner">embalaje inner</option>
            <option value="otro">otro</option>
          </select>
        </div>

        <div id="mp-campo-otro-mat" class="field hidden">
          <label for="mp-otro-mat">Tipo de material (otro)</label>
          <input type="text" id="mp-otro-mat" enterkeyhint="done">
        </div>

        <div class="field">
          <label>Material</label>
          <div class="st-mp-pt-row">
            <button type="button" class="mat-pill" data-mat="ST" onclick="mpSeleccionarPrefijo('ST')">ST</button>
            <button type="button" class="mat-pill" data-mat="MP" onclick="mpSeleccionarPrefijo('MP')">MP</button>
            <button type="button" class="mat-pill" data-mat="PT" onclick="mpSeleccionarPrefijo('PT')">PT</button>
          </div>
          <div id="mp-box-num-ref" class="num-locked-box">
            <span id="mp-prefijo-fijo-span" class="prefijo-fijo hidden"></span>
            <input type="text" id="mp-num-ref" inputmode="none" pattern="\d{5}" maxlength="5">
          </div>
        </div>

        <div class="field">
          <label for="mp-lote">Lote</label>
          <input type="text" id="mp-lote" enterkeyhint="done">
        </div>

        <div class="field">
          <label for="mp-cantidad">Cantidad puesta</label>
          <input type="text" id="mp-cantidad" inputmode="none" pattern="[0-9]*" value="1">
        </div>
      </div>

      <div class="keypad-and-action">
        <div class="fixed-numpad" aria-label="Teclado numérico fijo">
          <div class="numpad-grid">
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '1')">1</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '2')">2</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '3')">3</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '4')">4</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '5')">5</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '6')">6</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '7')">7</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '8')">8</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '9')">9</button>
            <button type="button" class="num-key key-clear" onpointerdown="mpLimpiarCampoNumerico(event)">C</button>
            <button type="button" class="num-key" onpointerdown="mpPulsarNumero(event, '0')">0</button>
            <button type="button" class="num-key key-del" onpointerdown="mpBorrarNumero(event)">⌫</button>
          </div>
        </div>

        <button type="button" class="action-btn" style="background:var(--success);" onclick="guardarMaterialPuestoEnOpc()">AÑADIR MATERIAL PUESTO</button>
      </div>
    </div>

    <div id="mp-form-error" class="error-msg" style="margin:0;"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let sesionCarr = JSON.parse(localStorage.getItem('sesionCarretillero') || 'null');
  let pedidosHoyTodos = [];
  let pedidosPendientes = [];
  let pedidosCompletados = [];
  let idsConocidos = new Set();
  let primeraCarga = true;
  let audioCtx = null;
  let pestanaActual = 'cola';
  let opcsCompletadas = new Set(JSON.parse(localStorage.getItem('opcsCompletadasCarr') || '[]'));
  let apuntesOpcManuales = cargarApuntesOpcManuales();
  let cargandoCarr = false;
  let ultimoRenderCarr = '';
  let ultimoRenderOpc = '';

  // Estado del desplegable de añadir material puesto
  let mpPrefijoSeleccionado = '';
  let mpCampoActivo = null;
  let mpReemplazarSiguiente = false;
  let scrollPrevioOpc = 0;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function hoyFechaClave() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function cargarApuntesOpcManuales() {
    try {
      const raw = JSON.parse(localStorage.getItem('apuntesOpcManualesCarr') || 'null');
      if (!raw || raw.fecha !== hoyFechaClave()) {
        return { fecha: hoyFechaClave(), opcs: {} };
      }
      return { fecha: raw.fecha, opcs: raw.opcs || {} };
    } catch (_) {
      return { fecha: hoyFechaClave(), opcs: {} };
    }
  }

  function guardarApuntesOpcManuales() {
    apuntesOpcManuales.fecha = hoyFechaClave();
    try {
      localStorage.setItem('apuntesOpcManualesCarr', JSON.stringify(apuntesOpcManuales));
    } catch (_) {}
  }

  function asegurarOpcManual(codigoOpc, lineaTexto = '') {
    if (apuntesOpcManuales.fecha !== hoyFechaClave()) {
      apuntesOpcManuales = { fecha: hoyFechaClave(), opcs: {} };
    }
    if (!apuntesOpcManuales.opcs[codigoOpc]) {
      apuntesOpcManuales.opcs[codigoOpc] = {
        opc: codigoOpc,
        ultimaFechaMs: Date.now(),
        lineas: lineaTexto ? [lineaTexto] : [],
        solicitantes: [sesionCarr?.nombre || 'Carretillero'],
        materiales: []
      };
    } else {
      apuntesOpcManuales.opcs[codigoOpc].ultimaFechaMs = Date.now();
      if (lineaTexto && !apuntesOpcManuales.opcs[codigoOpc].lineas.includes(lineaTexto)) {
        apuntesOpcManuales.opcs[codigoOpc].lineas.push(lineaTexto);
      }
    }
  }

  function anadirOpcManualPrompt() {
    const entrada = prompt('Escribe el número de OPC (4 dígitos):');
    if (entrada === null) return;
    const codigo = String(entrada).replace(/\D/g, '').trim();
    if (codigo.length !== 4) {
      alert('La OPC debe tener 4 dígitos.');
      return;
    }
    asegurarOpcManual(codigo);
    guardarApuntesOpcManuales();
    ultimoRenderOpc = '';
    renderizarApuntesOpc();
  }

  function inicioHoyISO() {
    const ahora = new Date();
    const inicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), 0, 0, 0, 0);
    return inicio.toISOString();
  }

  function codificarMetaEnMaterial(resumenBase, tiempoSel, venceMs, cantidadNum, puestosNum) {
    const limpio = String(resumenBase || 'Material').replace(/\s*\[\[META:[^\]]+\]\]\s*$/g, '').trim() || 'Material';
    const cant = Math.max(1, parseInt(cantidadNum, 10) || 1);
    const puestos = Math.max(0, Math.min(cant, parseInt(puestosNum, 10) || 0));
    const meta = {
      t: tiempoSel || null,
      v: venceMs || null,
      c: cant,
      u: puestos
    };
    return `${limpio} [[META:${btoa(unescape(encodeURIComponent(JSON.stringify(meta))))}]]`;
  }

  function extraerOpcDePedido(p) {
    if (p?.opc && String(p.opc).trim()) {
      return String(p.opc).trim();
    }
    const texto = `${p?.material || ''} ${p?.material_limpio || ''}`;
    const matchOpc = texto.match(/\bOPC\s*[:#-]?\s*(\d{4})\b/i);
    return matchOpc ? matchOpc[1] : '';
  }

  function decodificarPedidoConMeta(p) {
    const rawMat = String(p?.material || '');
    const match = rawMat.match(/\[\[META:([^\]]+)\]\]\s*$/);
    let meta = { t: null, v: null, c: 1, u: 0 };
    let materialLimpio = rawMat.trim();
    if (match) {
      materialLimpio = rawMat.replace(/\[\[META:[^\]]+\]\]\s*$/g, '').trim();
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(match[1].trim()))));
        const cantParseada = Math.max(1, parseInt(parsed.c, 10) || 1);
        const rawU = Math.max(0, parseInt(parsed.u, 10) || 0);
        const puestosParseados = p.estado === 'completado'
          ? cantParseada
          : Math.min(cantParseada, rawU);
        meta = {
          t: parsed.t || null,
          v: parsed.v ? Number(parsed.v) : null,
          c: cantParseada,
          u: puestosParseados
        };
      } catch (_) {}
    } else if (p?.estado === 'completado') {
      meta.u = 1;
    }

    const estadoEfectivo = (p.estado === 'completado' || meta.u >= meta.c)
      ? 'completado'
      : p.estado;

    return {
      ...p,
      estado: estadoEfectivo,
      material_limpio: materialLimpio,
      tiempo_aviso: p.tiempo_aviso || meta.t,
      vence_en: p.vence_en || (meta.v ? new Date(meta.v).toISOString() : null),
      vence_ms: p.vence_en ? new Date(p.vence_en).getTime() : meta.v,
      cantidad: Math.max(1, parseInt(meta.c || p.cantidad || 1, 10) || 1),
      puestos: estadoEfectivo === 'completado' ? Math.max(1, parseInt(meta.c || p.cantidad || 1, 10) || 1) : meta.u
    };
  }

  function esPedidoConTiempo(p) {
    return Boolean(p && (p.tiempo_aviso || p.vence_ms));
  }

  function estaVencidoTiempo(p) {
    if (!esPedidoConTiempo(p)) return true;
    const ms = p.vence_ms || (p.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return true;
    return Date.now() >= ms;
  }

  function formatearHoraVencimiento(p) {
    const ms = p?.vence_ms || (p?.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return '';
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function ordenarPendientesCarretillero(lista) {
    const sinTiempo = lista.filter(p => !esPedidoConTiempo(p));
    const conTiempoVencido = lista.filter(p => esPedidoConTiempo(p) && estaVencidoTiempo(p));
    const conTiempoFuturo = lista.filter(p => esPedidoConTiempo(p) && !estaVencidoTiempo(p));

    const normales = [...sinTiempo, ...conTiempoVencido].sort(
      (a, b) => new Date(a.creado_en).getTime() - new Date(b.creado_en).getTime()
    );

    conTiempoFuturo.sort((a, b) => {
      const va = a.vence_ms || (a.vence_en ? new Date(a.vence_en).getTime() : Number.MAX_SAFE_INTEGER);
      const vb = b.vence_ms || (b.vence_en ? new Date(b.vence_en).getTime() : Number.MAX_SAFE_INTEGER);
      if (va !== vb) return va - vb;
      return new Date(a.creado_en).getTime() - new Date(b.creado_en).getTime();
    });

    return [...normales, ...conTiempoFuturo];
  }

  function sonarPitidoFuerte() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      const ahora = audioCtx.currentTime;
      const tonos = [
        [880, ahora, 0.22],
        [1174, ahora + 0.25, 0.26]
      ];
      tonos.forEach(([freq, start, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.45, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      });
    } catch (_) {}
  }

  function emitirNotificacion(titulo, cuerpo) {
    sonarPitidoFuerte();
    try {
      if ('Notification' in window && Notification.permission === 'granted') {

        }

    } catch (_) {}
  }

  function tieneLoteConcreto(p) {
    return Boolean(p.lote && p.lote.trim() && p.lote.trim().toUpperCase() !== 'FIFO');
  }

  function obtenerCantidadPedido(p) {
    return Math.max(1, Number(p?.cantidad) || 1);
  }

  function obtenerPuestosPedido(p) {
    const cant = obtenerCantidadPedido(p);
    if (p?.estado === 'completado') return cant;
    return Math.max(0, Math.min(cant, Number(p?.puestos) || 0));
  }

  function formatearTituloPedido(p) {
    const opcCod = extraerOpcDePedido(p);
    const refFmt = p.num_referencia ? (p.tipo_material ? `${p.tipo_material}-${p.num_referencia}` : p.num_referencia) : '';
    const cant = obtenerCantidadPedido(p);
    const cantTxt = cant > 1 ? `x${cant}` : '';
    const partes = [refFmt, opcCod ? `OPC ${opcCod}` : '', p.clase_material || '', cantTxt].filter(Boolean);
    const base = partes.length > 0 ? partes.join(' · ') : (p.material_limpio || p.material || 'Material');
    if (tieneLoteConcreto(p)) {
      return `${base} · Lote ${p.lote.trim()}`;
    }
    return base;
  }

  async function cogerUnaUnidad(id) {
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    if (!pedido) return;
    const cant = obtenerCantidadPedido(pedido);
    const nuevosPuestos = Math.min(cant, obtenerPuestosPedido(pedido) + 1);
    const completadoAhora = nuevosPuestos >= cant;

    const nuevoMaterial = codificarMetaEnMaterial(
      pedido.material_limpio || pedido.material || 'Material',
      pedido.tiempo_aviso,
      pedido.vence_ms,
      cant,
      nuevosPuestos
    );

    const { error } = await db
      .from('pedidos')
      .update({
        material: nuevoMaterial,
        estado: completadoAhora ? 'completado' : 'pendiente'
      })
      .eq('id', id);

    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function marcarListo(id) {
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    const cant = pedido ? obtenerCantidadPedido(pedido) : 1;
    const nuevoMaterial = pedido
      ? codificarMetaEnMaterial(
          pedido.material_limpio || pedido.material || 'Material',
          pedido.tiempo_aviso,
          pedido.vence_ms,
          cant,
          cant
        )
      : undefined;

    const updatePayload = nuevoMaterial
      ? { estado: 'completado', material: nuevoMaterial }
      : { estado: 'completado' };

    const { error } = await db.from('pedidos').update(updatePayload).eq('id', id);
    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function desmarcarPedido(id) {
    const confirmar = confirm('AVISO: Vas a desmarcar este pedido marcado como LISTO y volverá a aparecer como PENDIENTE. ¿Quieres continuar?');
    if (!confirmar) return;
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    const cant = pedido ? obtenerCantidadPedido(pedido) : 1;
    const puestosReset = cant > 1 ? Math.max(0, cant - 1) : 0;
    const nuevoMaterial = pedido
      ? codificarMetaEnMaterial(
          pedido.material_limpio || pedido.material || 'Material',
          pedido.tiempo_aviso,
          pedido.vence_ms,
          cant,
          puestosReset
        )
      : undefined;

    const updatePayload = nuevoMaterial
      ? { estado: 'pendiente', material: nuevoMaterial }
      : { estado: 'pendiente' };

    const { error } = await db.from('pedidos').update(updatePayload).eq('id', id);
    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function cargarPedidos() {
    if (!sesionCarr || cargandoCarr) return;
    cargandoCarr = true;
    try {
      const { data, error } = await db
        .from('pedidos')
        .select('*')
        .neq('estado', 'cancelado')
        .gte('creado_en', inicioHoyISO())
        .order('creado_en', { ascending: true });

      if (!error && data) {
        const normalizados = data.map(decodificarPedidoConMeta);
        for (const p of normalizados) {
          if (p.estado === 'completado' && p.puestos >= p.cantidad) {
            const raw = data.find(r => r.id === p.id);
            if (raw && raw.estado !== 'completado') {
              await db.from('pedidos').update({
                estado: 'completado',
                material: codificarMetaEnMaterial(p.material_limpio, p.tiempo_aviso, p.vence_ms, p.cantidad, p.cantidad)
              }).eq('id', p.id);
            }
          }
        }

        const pendientes = ordenarPendientesCarretillero(normalizados.filter(p => p.estado !== 'completado'));
        const completados = normalizados.filter(p => p.estado === 'completado').reverse();

        if (!primeraCarga) {
          pendientes.forEach(p => {
            if (!idsConocidos.has(p.id)) {
              const extraHora = esPedidoConTiempo(p) ? ` · Necesario ${formatearHoraVencimiento(p)}` : '';
              emitirNotificacion(
                `${p.linea}${extraHora}`,
                `${formatearTituloPedido(p)} (${p.solicitado_por || ''})`
              );
            }
          });
        }

        idsConocidos = new Set(pendientes.map(p => p.id));
        primeraCarga = false;
        pedidosHoyTodos = normalizados;
        pedidosPendientes = pendientes;
        pedidosCompletados = completados;
        renderizarCarretillero();
        renderizarApuntesOpc();
        actualizarEstadoRed(true);
      } else if (error) {
        actualizarEstadoRed(false);
      }
    } finally {
      cargandoCarr = false;
    }
  }

  const mpPrefijoSpan = document.getElementById('mp-prefijo-fijo-span');
  const mpBoxNumRef = document.getElementById('mp-box-num-ref');

  const MP_CAMPOS_NUMERICOS = [
    { el: mpInputLinea, maxLen: 4, soloDigitos: true },
    { el: mpInputNumRef, maxLen: 5, soloDigitos: true },
    { el: mpInputLote, maxLen: 24, soloDigitos: false },
    { el: mpInputCantidad, maxLen: 3, soloDigitos: true }
  ];

  function mpSeleccionarCampo(el, reemplazar = false) {
    if (!el) return;
    mpCampoActivo = el;
    mpReemplazarSiguiente = Boolean(reemplazar);
    MP_CAMPOS_NUMERICOS.forEach(item => {
      item.el.classList.toggle('keypad-target-active', item.el === el);
    });
    if (mpBoxNumRef) {
      mpBoxNumRef.classList.toggle('keypad-box-active', el === mpInputNumRef);
    }
  }

  MP_CAMPOS_NUMERICOS.forEach(item => {
    item.el.addEventListener('focus', () => {
      mpSeleccionarCampo(item.el, item.el === mpInputCantidad);
    });
    item.el.addEventListener('pointerdown', () => {
      mpSeleccionarCampo(item.el, item.el === mpInputCantidad);
    });
    item.el.addEventListener('input', (e) => {
      if (item.soloDigitos) {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, item.maxLen);
      } else {
        e.target.value = e.target.value.slice(0, item.maxLen);
      }
      if (item.el === mpInputNumRef) {
        mpActualizarVisibilidadClaseMaterial();
      }
    });
  });

  function mpPulsarNumero(ev, digito) {
    if (ev) ev.preventDefault();
    const target = mpCampoActivo || mpInputNumRef;
    mpSeleccionarCampo(target, false);
    const meta = MP_CAMPOS_NUMERICOS.find(i => i.el === target);
    const maxLen = meta ? meta.maxLen : 5;
    const soloDigitos = meta ? meta.soloDigitos : true;

    let actual = soloDigitos ? target.value.replace(/\D/g, '') : target.value;
    if (mpReemplazarSiguiente) {
      actual = '';
      mpReemplazarSiguiente = false;
    }
    if (actual.length >= maxLen) return;

    target.value = actual + digito;
    target.focus();
    if (target === mpInputNumRef) mpActualizarVisibilidadClaseMaterial();
  }

  function mpBorrarNumero(ev) {
    if (ev) ev.preventDefault();
    const target = mpCampoActivo || mpInputNumRef;
    mpSeleccionarCampo(target, false);
    const meta = MP_CAMPOS_NUMERICOS.find(i => i.el === target);
    const soloDigitos = meta ? meta.soloDigitos : true;
    const actual = soloDigitos ? target.value.replace(/\D/g, '') : target.value;
    target.value = actual.slice(0, -1);
    target.focus();
    if (target === mpInputNumRef) mpActualizarVisibilidadClaseMaterial();
  }

  function mpLimpiarCampoNumerico(ev) {
    if (ev) ev.preventDefault();
    const target = mpCampoActivo || mpInputNumRef;
    mpSeleccionarCampo(target, false);
    target.value = (target === mpInputCantidad) ? '1' : '';
    if (target === mpInputCantidad) mpReemplazarSiguiente = true;
    target.focus();
    if (target === mpInputNumRef) mpActualizarVisibilidadClaseMaterial();

  function guardarMaterialPuestoEnOpc() {
    const err = document.getElementById('mp-form-error');
    const codigoOpc = mpInputOpc.value.trim();
    const numLinea = mpInputLinea.value.trim();
    const numRef = mpInputNumRef.value.trim();
    const loteInput = mpInputLote.value.trim();
    const cantidadPuesta = Math.max(1, parseInt(mpInputCantidad.value, 10) || 1);

    const claseMaterial = mpObtenerClaseMaterialFinal();
    const refCompleta = Boolean(mpPrefijoSeleccionado && numRef.length === 5);
    const permiteSoloClase = Boolean(claseMaterial && numRef.length === 0 && !mpPrefijoSeleccionado);

    if (numRef.length > 0 && numRef.length !== 5) {
      err.innerText = 'El número de referencia debe tener 5 dígitos.';
      mpSeleccionarCampo(mpInputNumRef);
      return;
    }

    if (mpPrefijoSeleccionado && !refCompleta) {
      err.innerText = 'Escribe los 5 dígitos de referencia o desmarca ST/MP/PT.';
      mpSeleccionarCampo(mpInputNumRef);
      return;
    }

    if (!refCompleta && !permiteSoloClase) {
      err.innerText = 'Indica Material (ST/MP/PT + 5 dígitos) o Tipo de material.';
      return;
    }

    const refFmt = refCompleta ? `${mpPrefijoSeleccionado}-${numRef}` : '';
    const nombreMat = [refFmt, claseMaterial].filter(Boolean).join(' · ') || 'Material';
    const loteTxt = loteInput ? `Lote ${loteInput}` : 'FIFO';
    const lineaTexto = numLinea ? `Línea ${numLinea}` : '';

    asegurarOpcManual(codigoOpc, lineaTexto);
    const listaMat = apuntesOpcManuales.opcs[codigoOpc].materiales;
    const claveMat = `${nombreMat.toLowerCase()}|${loteTxt.toLowerCase()}`;
    const existente = listaMat.find(m => `${m.nombre.toLowerCase()}|${m.lote.toLowerCase()}` === claveMat);

    if (existente) {
      existente.cantidadTotal += cantidadPuesta;
      existente.puestosTotal += cantidadPuesta;
    } else {
      listaMat.push({
        nombre: nombreMat,
        lote: loteTxt,
        cantidadTotal: cantidadPuesta,
        puestosTotal: cantidadPuesta
      });
    }

    guardarApuntesOpcManuales();
    ultimoRenderOpc = '';
    renderizarApuntesOpc();
    cerrarModalMaterialPuesto();
  }

  /* =========================================================
     AGRUPACIÓN Y RENDER DE APUNTES OPC
     ========================================================= */
  function obtenerGruposOpcRelevantes() {
    const mapaOpc = new Map();

    pedidosHoyTodos.forEach(p => {
      const codigoOpc = extraerOpcDePedido(p);
      if (!codigoOpc) return;

      const cant = obtenerCantidadPedido(p);
      const puestos = obtenerPuestosPedido(p);
      const refFmt = p.num_referencia ? (p.tipo_material ? `${p.tipo_material}-${p.num_referencia}` : p.num_referencia) : '';
      const nombreMat = [refFmt, p.clase_material || ''].filter(Boolean).join(' · ') || (p.material_limpio || 'Material');
      const loteTxt = (p.lote && p.lote !== 'FIFO') ? `Lote ${p.lote}` : 'FIFO';

      if (!mapaOpc.has(codigoOpc)) {
        mapaOpc.set(codigoOpc, {
          opc: codigoOpc,
          ultimaFechaMs: new Date(p.creado_en).getTime(),
          lineas: new Set(),
          solicitantes: new Set(),
          materialesMap: new Map()
        });
      }

      const grupo = mapaOpc.get(codigoOpc);
      const fechaMs = new Date(p.creado_en).getTime();
      if (fechaMs > grupo.ultimaFechaMs) grupo.ultimaFechaMs = fechaMs;
      if (p.linea) grupo.lineas.add(p.linea);
      if (p.solicitado_por) grupo.solicitantes.add(p.solicitado_por);

      const claveMat = `${nombreMat.toLowerCase()}|${loteTxt.toLowerCase()}`;
      if (!grupo.materialesMap.has(claveMat)) {
        grupo.materialesMap.set(claveMat, {
          nombre: nombreMat,
          lote: loteTxt,
          cantidadTotal: cant,
          puestosTotal: puestos
        });
      } else {
        const matEntry = grupo.materialesMap.get(claveMat);
        matEntry.cantidadTotal += cant;
        matEntry.puestosTotal += puestos;
      }
    });

    if (apuntesOpcManuales.fecha === hoyFechaClave()) {
      Object.values(apuntesOpcManuales.opcs || {}).forEach(man => {
        const codigoOpc = String(man.opc || '').trim();
        if (!codigoOpc) return;

        if (!mapaOpc.has(codigoOpc)) {
          mapaOpc.set(codigoOpc, {
            opc: codigoOpc,
            ultimaFechaMs: man.ultimaFechaMs || Date.now(),
            lineas: new Set(man.lineas || []),
            solicitantes: new Set(man.solicitantes || []),
            materialesMap: new Map()
          });
        }

        const grupo = mapaOpc.get(codigoOpc);
        if ((man.ultimaFechaMs || 0) > grupo.ultimaFechaMs) {
          grupo.ultimaFechaMs = man.ultimaFechaMs;
        }
        (man.lineas || []).forEach(l => grupo.lineas.add(l));
        (man.solicitantes || []).forEach(s => grupo.solicitantes.add(s));

        (man.materiales || []).forEach(m => {
          const claveMat = `${(m.nombre || '').toLowerCase()}|${(m.lote || 'FIFO').toLowerCase()}`;
          if (!grupo.materialesMap.has(claveMat)) {
            grupo.materialesMap.set(claveMat, {
              nombre: m.nombre,
              lote: m.lote || 'FIFO',
              cantidadTotal: Number(m.cantidadTotal) || 1,
              puestosTotal: Number(m.puestosTotal) || 0
            });
          } else {
            const matEntry = grupo.materialesMap.get(claveMat);
            matEntry.cantidadTotal += Number(m.cantidadTotal) || 1;
            matEntry.puestosTotal += Number(m.puestosTotal) || 0;
          }
        });
      });
    }

    return [...mapaOpc.values()]
      .map(g => ({
        opc: g.opc,
        ultimaFechaMs: g.ultimaFechaMs,
        lineas: [...g.lineas],
        solicitantes: [...g.solicitantes],
        materiales: [...g.materialesMap.values()]
      }))
      .sort((a, b) => b.ultimaFechaMs - a.ultimaFechaMs);
  }

  function renderizarApuntesOpc() {
    const cont = document.getElementById('lista-apuntes-opc');
    const badge = document.getElementById('contador-apuntes-opc');
    if (!cont || !badge) return;

    const grupos = obtenerGruposOpcRelevantes();
    const badgeTxt = `${grupos.length} OPC`;
    if (badge.innerText !== badgeTxt) badge.innerText = badgeTxt;

    const firma = JSON.stringify({
      done: [...opcsCompletadas],
      grupos
    });
    if (firma === ultimoRenderOpc) return;
    ultimoRenderOpc = firma;

    if (grupos.length === 0) {
      cont.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin OPC registradas hoy.</p>';
      return;
    }

    cont.innerHTML = grupos.map(g => {
      const hecha = opcsCompletadas.has(g.opc);
      const hora = new Date(g.ultimaFechaMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const metaSup = [hora, g.lineas.join(', '), g.solicitantes.join(', ')].filter(Boolean).join(' · ');
      const itemsHtml = g.materiales.length === 0
        ? '<li style="color:var(--muted);">Sin materiales aún</li>'
        : g.materiales.map(m => {
            const detalleCant = (m.cantidadTotal > 1 || m.puestosTotal > 0)
              ? ` — <strong>Cantidad: ${m.cantidadTotal}</strong> (Puestos: ${m.puestosTotal}/${m.cantidadTotal})`
              : '';
            return `<li>${m.nombre}${detalleCant} (${m.lote})</li>`;
          }).join('');

      return `
        <div class="opc-apunte-item ${hecha ? 'hecho-apunte' : ''}">
          <div class="pedido-info">
            <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">${metaSup}</div>
            <div class="opc-titulo-linea">
              <div class="pedido-titulo" style="margin:0;">OPC ${g.opc}</div>
              <button type="button" class="btn-opc-accion" onclick="abrirModalMaterialPuesto('${g.opc}')">+ Añadir material puesto</button>
            </div>
            <ul class="opc-mat-list">${itemsHtml}</ul>
            <span class="badge ${hecha ? 'listo' : ''}">${hecha ? 'OPC completada' : 'OPC pendiente'}</span>
          </div>
          <div class="acciones-carr">
            <button type="button" class="${hecha ? 'btn-desmarcar' : 'btn-hecho'}" onclick="alternarOpcCompletada('${g.opc}')">
              ${hecha ? 'Desmarcar OPC' : 'Marcar OPC completada ✓'}
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderizarCarretillero() {
    const lista = document.getElementById('lista-carretillero');
    const listaComp = document.getElementById('lista-completados');
    const pendBadge = document.getElementById('contador-pendientes');
    const compBadge = document.getElementById('contador-completados');

    const pendTxt = `${pedidosPendientes.length} pendientes`;
    const compTxt = `${pedidosCompletados.length} listos`;
    if (pendBadge.innerText !== pendTxt) pendBadge.innerText = pendTxt;
    if (compBadge.innerText !== compTxt) compBadge.innerText = compTxt;

    const minutoClave = Math.floor(Date.now() / 60000);
    const firma = JSON.stringify({
      m: minutoClave,
      p: pedidosPendientes.map(x => [x.id, x.material, x.lote, x.linea, x.solicitado_por, x.puestos, x.cantidad]),
      c: pedidosCompletados.map(x => [x.id, x.material, x.lote, x.linea, x.solicitado_por, x.puestos, x.cantidad])
    });
    if (firma === ultimoRenderCarr) return;
    ultimoRenderCarr = firma;

    if (pedidosPendientes.length === 0) {
      lista.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin pedidos pendientes.</p>';
    } else {
      lista.innerHTML = pedidosPendientes.map((p, index) => {
        const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const titulo = formatearTituloPedido(p);
        const cant = obtenerCantidadPedido(p);
        const puestos = obtenerPuestosPedido(p);
        const quedan = Math.max(0, cant - puestos);
        const subPartes = [];
        if (!tieneLoteConcreto(p)) subPartes.push('FIFO');
        if (p.solicitado_por) subPartes.push(p.solicitado_por);

        const conTiempo = esPedidoConTiempo(p);
        const vencido = estaVencidoTiempo(p);
        const horaVence = formatearHoraVencimiento(p);
        const cantHtml = cant > 1
          ? `<div class="pedido-cant-info">Cantidad pedida: ${cant} · Puestos: ${puestos} · Quedan: ${quedan}</div>`
          : '';

        const accionHtml = cant > 1
          ? `<button type="button" class="btn-coger-uno" onclick="cogerUnaUnidad(${p.id})">Coger 1 (${quedan} rest.)</button>`
          : `<button type="button" class="btn-hecho" onclick="marcarListo(${p.id})">Listo ✓</button>`;

        return `
          <div class="pedido-item ${(conTiempo && !vencido) ? 'con-tiempo-futuro' : ''}">
            <div class="pedido-info">
              <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">#${index + 1} · ${hora} · ${p.linea}</div>
              <div class="pedido-titulo">${titulo}</div>
              ${cantHtml}
              ${subPartes.length > 0 ? `<div style="font-size:0.92rem; color:#cbd5e1; font-weight:700;">${subPartes.join(' · ')}</div>` : ''}
              <span class="badge">Pendiente</span>
              ${conTiempo ? `<span class="badge tiempo">${p.tiempo_aviso} · Hora exacta: ${horaVence}${vencido ? ' (En hora)' : ' (Programado)'}</span>` : ''}
            </div>
            <div class="acciones-carr">
              ${accionHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    if (pedidosCompletados.length === 0) {
      listaComp.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin pedidos completados hoy.</p>';
    } else {
      listaComp.innerHTML = pedidosCompletados.map((p) => {
        const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const titulo = formatearTituloPedido(p);
        const cant = obtenerCantidadPedido(p);
        const subPartes = [];
        if (cant > 1) subPartes.push(`Cantidad pedida: ${cant}`, `Puestos: ${cant}`);
        if (!tieneLoteConcreto(p)) subPartes.push('FIFO');
        if (p.solicitado_por) subPartes.push(p.solicitado_por);

        return `
          <div class="pedido-item completado">
            <div class="pedido-info">
              <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">${hora} · ${p.linea}</div>
              <div class="pedido-titulo">${titulo}</div>
              ${subPartes.length > 0 ? `<div style="font-size:0.92rem; color:#cbd5e1; font-weight:700;">${subPartes.join(' · ')}</div>` : ''}
              <span class="badge listo">Listo</span>
            </div>
            <div class="acciones-carr">
              <button type="button" class="btn-desmarcar" onclick="desmarcarPedido(${p.id})">Desmarcar</button>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  db.channel('cambios-pedidos-carr')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
      cargarPedidos();
    })
    .subscribe();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sesionCarr) {
      ultimoRenderCarr = '';
      ultimoRenderOpc = '';
      cargarPedidos();
    }
  });

  setInterval(() => {
    if (sesionCarr && document.visibilityState === 'visible') {
      pedidosPendientes = ordenarPendientesCarretillero(pedidosPendientes);
      renderizarCarretillero();
      cargarPedidos();
    }
  }, 6500);

  if (sesionCarr) {
    mostrarCola();
  }
</script>
