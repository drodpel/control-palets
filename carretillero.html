<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets - Carretillero</title>
  <link rel="manifest" href="manifest-carretillero.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #ffffff;
      --muted: #e2e8f0;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      min-height: 100dvh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .user-pill { font-size: 0.95rem; color: var(--muted); margin-top: 4px; font-weight: 800; }
    .btn-top {
      background: #334155;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 900; color: var(--muted); font-size: 1.05rem; }
    input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
      margin-bottom: 12px;
    }
    button.action-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.12rem;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
    }
    .error-msg { color: #fca5a5; font-weight: 900; margin-bottom: 10px; min-height: 20px; }
    #network-status {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
    }
    #network-status.offline { background: #d9770633; color: #fbbf24; }
    .pedido-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 9px;
      border-left: 6px solid var(--warning);
      flex-wrap: wrap;
    }
    .pedido-titulo {
      font-size: 1.2rem;
      font-weight: 900;
      margin: 3px 0;
      color: #ffffff;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 5px;
      background: #d9770644;
      color: #fbbf24;
    }
    .btn-hecho {
      padding: 12px 18px;
      border: none;
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: var(--success);
      font-size: 1rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h2 style="margin:0; font-size: 1.2rem; font-weight:900;">Cola de Carretillero</h2>
      <span id="network-status">● Conectado</span>
      <div id="info-carr" class="user-pill hidden"></div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btn-notif" class="btn-top hidden" onclick="activarNotificaciones()">🔔 Avisos</button>
      <button id="btn-salir" class="btn-top hidden" onclick="cerrarSesion()">Cambiar nombre</button>
    </div>
  </header>

  <div id="vista-login" class="card">
    <label for="input-nombre">Nombre</label>
    <input type="text" id="input-nombre" autocomplete="name">
    <div id="login-error" class="error-msg"></div>
    <button type="button" class="action-btn" onclick="entrar()">ENTRAR</button>
  </div>

  <div id="vista-cola" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0;">Pendientes</h3>
      <span id="contador-pendientes" style="font-weight:900; color:var(--muted);">0 pendientes</span>
    </div>
    <div id="lista-carretillero"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let sesionCarr = JSON.parse(localStorage.getItem('sesionCarretillero') || 'null');
  let pedidosCache = [];
  let idsConocidos = new Set();
  let primeraCarga = true;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function entrar() {
    const nombre = document.getElementById('input-nombre').value.trim();
    const err = document.getElementById('login-error');
    if (!nombre) {
      err.innerText = 'Escribe tu nombre.';
      return;
    }
    err.innerText = '';
    sesionCarr = { nombre };
    localStorage.setItem('sesionCarretillero', JSON.stringify(sesionCarr));
    mostrarCola();
  }

  function cerrarSesion() {
    localStorage.removeItem('sesionCarretillero');
    sesionCarr = null;
    primeraCarga = true;
    idsConocidos.clear();
    document.getElementById('vista-cola').classList.add('hidden');
    document.getElementById('vista-login').classList.remove('hidden');
    document.getElementById('info-carr').classList.add('hidden');
    document.getElementById('btn-notif').classList.add('hidden');
    document.getElementById('btn-salir').classList.add('hidden');
  }

  function mostrarCola() {
    if (!sesionCarr) return;
    document.getElementById('vista-login').classList.add('hidden');
    document.getElementById('vista-cola').classList.remove('hidden');
    document.getElementById('info-carr').classList.remove('hidden');
    document.getElementById('info-carr').innerText = sesionCarr.nombre;
    document.getElementById('btn-notif').classList.remove('hidden');
    document.getElementById('btn-salir').classList.remove('hidden');
    actualizarBotonNotif();
    cargarPedidos();
  }

  function actualizarEstadoRed(online) {
    const badge = document.getElementById('network-status');
    badge.innerText = online ? '● Conectado' : '● Sin cobertura';
    badge.className = online ? '' : 'offline';
  }

  function actualizarBotonNotif() {
    const btn = document.getElementById('btn-notif');
    if (!('Notification' in window)) {
      btn.innerText = 'Avisos no soportados';
      return;
    }
    if (Notification.permission === 'granted') {
      btn.innerText = '🔔 Avisos activos';
    } else if (Notification.permission === 'denied') {
      btn.innerText = '🔕 Avisos bloqueados';
    } else {
      btn.innerText = '🔔 Activar avisos';
    }
  }

  async function activarNotificaciones() {
    if (!('Notification' in window)) return;
    const perm = await Notification.requestPermission();
    actualizarBotonNotif();
    if (perm === 'granted') {
      emitirNotificacion('Avisos activados', 'Avisos listos.');
    }
  }

  function emitirNotificacion(titulo, cuerpo) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 740;
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    } catch (_) {}

    if ('Notification' in window && Notification.permission === 'granted') {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(titulo, {
            body: cuerpo,
            tag: 'nuevo-pedido-palets',
            renotify: true
          });
        }).catch(() => {
          new Notification(titulo, { body: cuerpo });
        });
      } else {
        new Notification(titulo, { body: cuerpo });
      }
    }
  }

  function tieneLoteConcreto(p) {
    return Boolean(p.lote && p.lote.trim() && p.lote.trim().toUpperCase() !== 'FIFO');
  }

  function formatearTituloPedido(p) {
    const refFmt = p.num_referencia ? (p.tipo_material ? `${p.tipo_material}-${p.num_referencia}` : p.num_referencia) : '';
    const partes = [refFmt, p.opc ? `OPC ${p.opc}` : '', p.clase_material || ''].filter(Boolean);
    const base = partes.length > 0 ? partes.join(' · ') : (p.material || 'Material');
    if (tieneLoteConcreto(p)) {
      return `${base} · Lote ${p.lote.trim()}`;
    }
    return base;
  }

  async function marcarListo(id) {
    const { error } = await db.from('pedidos').update({ estado: 'completado' }).eq('id', id);
    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function cargarPedidos() {
    if (!sesionCarr) return;
    const { data, error } = await db
      .from('pedidos')
      .select('*')
      .not('estado', 'in', '(completado,cancelado)')
      .order('creado_en', { ascending: true });

    if (!error && data) {
      if (!primeraCarga) {
        data.forEach(p => {
          if (!idsConocidos.has(p.id)) {
            emitirNotificacion(
              `${p.linea}`,
              `${formatearTituloPedido(p)} (${p.solicitado_por || ''})`
            );
          }
        });
      }

      idsConocidos = new Set(data.map(p => p.id));
      primeraCarga = false;
      pedidosCache = data;
      renderizarCarretillero();
      actualizarEstadoRed(true);
    } else if (error) {
      actualizarEstadoRed(false);
    }
  }

  function renderizarCarretillero() {
    const lista = document.getElementById('lista-carretillero');
    document.getElementById('contador-pendientes').innerText = `${pedidosCache.length} pendientes`;

    if (pedidosCache.length === 0) {
      lista.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin pedidos pendientes.</p>';
      return;
    }

    lista.innerHTML = pedidosCache.map((p, index) => {
      const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const titulo = formatearTituloPedido(p);
      const subPartes = [];
      if (!tieneLoteConcreto(p)) subPartes.push('FIFO');
      if (p.solicitado_por) subPartes.push(p.solicitado_por);

      return `
        <div class="pedido-item">
          <div>
            <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">#${index + 1} · ${hora} · ${p.linea}</div>
            <div class="pedido-titulo">${titulo}</div>
            ${subPartes.length > 0 ? `<div style="font-size:0.92rem; color:#cbd5e1; font-weight:700;">${subPartes.join(' · ')}</div>` : ''}
            <span class="badge">Pendiente</span>
          </div>
          <button class="btn-hecho" onclick="marcarListo(${p.id})">Listo ✓</button>
        </div>
      `;
    }).join('');
  }

  db.channel('cambios-pedidos-carr')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
      cargarPedidos();
    })
    .subscribe();

  setInterval(cargarPedidos, 2500);
  if (sesionCarr) {
    mostrarCola();
  }
</script>
</body>
</html>
