<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets - Carretillero</title>
  <link rel="manifest" href="manifest-carretillero.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --purple: #7c3aed;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #ffffff;
      --muted: #e2e8f0;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .user-pill { font-size: 0.98rem; color: #ffffff; font-weight: 900; }
    .btn-top {
      background: #334155;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 9px;
      font-weight: 900;
      font-size: 0.96rem;
      cursor: pointer;
    }
    .tab-btn.activa {
      background: var(--primary);
      border-color: #93c5fd;
      color: #ffffff;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 900; color: var(--muted); font-size: 1.05rem; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
    }
    #vista-login input {
      margin-bottom: 12px;
    }
    button.action-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.12rem;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
    }
    .error-msg { color: #fca5a5; font-weight: 900; margin-top: 8px; margin-bottom: 8px; min-height: 20px; }
    .ok-msg { color: #4ade80; font-weight: 900; margin-top: 8px; margin-bottom: 8px; min-height: 20px; }
    #network-status {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
    }
    #network-status.offline { background: #d9770633; color: #fbbf24; }
    .seccion-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 8px 0;
    }
    #lista-carretillero, #lista-completados, #lista-apuntes-opc {
      overflow-anchor: none;
    }

    /* Botón siempre en esquina inferior derecha */
    .pedido-item {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 9px;
      border-left: 6px solid var(--warning);
    }
    .pedido-item.con-tiempo-futuro {
      border-left-color: var(--purple);
      background: #18132c;
    }
    .pedido-item.completado {
      border-left-color: var(--success);
      opacity: 0.92;
    }
    .pedido-cuerpo {
      min-width: 0;
      flex: 1;
    }
    .pedido-titulo {
      font-size: 1.2rem;
      font-weight: 900;
      margin: 3px 0;
      color: #ffffff;
    }
    .pedido-cant-info {
      font-size: 0.96rem;
      color: #93c5fd;
      font-weight: 900;
      margin-top: 3px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 5px;
      margin-right: 5px;
      background: #d9770644;
      color: #fbbf24;
    }
    .badge.listo {
      background: #16a34a44;
      color: #4ade80;
    }
    .badge.tiempo {
      background: #7c3aed55;
      color: #ddd6fe;
    }
    .acciones-carr {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      align-self: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-coger-uno {
      padding: 11px 16px;
      border: none;
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      font-size: 1rem;
      white-space: nowrap;
    }
    .btn-hecho {
      padding: 11px 18px;
      border: none;
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: var(--success);
      font-size: 1rem;
      white-space: nowrap;
    }
    .btn-desmarcar {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      background: #334155;
      font-size: 0.92rem;
      white-space: nowrap;
    }

    /* Paneles de gestión manual en Apuntes OPC */
    .opc-tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .opc-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .opc-box h4 {
      margin: 0 0 10px 0;
      font-size: 1.02rem;
      font-weight: 900;
      color: #93c5fd;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 95px 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-sec {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 9px;
      font-weight: 900;
      font-size: 0.98rem;
      color: #ffffff;
      background: var(--primary);
      cursor: pointer;
    }
    .btn-verde-sm {
      padding: 6px 10px;
      border: none;
      border-radius: 7px;
      font-weight: 900;
      font-size: 0.86rem;
      color: #ffffff;
      background: var(--success);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-azul-sm {
      padding: 6px 10px;
      border: none;
      border-radius: 7px;
      font-weight: 900;
      font-size: 0.86rem;
      color: #ffffff;
      background: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }
    .opc-apunte-item {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 6px solid var(--primary);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .opc-apunte-item.hecho-apunte {
      border-left-color: var(--success);
      opacity: 0.82;
    }
    .opc-mat-list {
      margin: 6px 0 4px 0;
      padding-left: 0;
      list-style: none;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.96rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .opc-mat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #111b2e;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 10px;
      flex-wrap: wrap;
    }
    .opc-mat-acciones {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-sumar-puestos {
      width: 66px !important;
      padding: 5px 7px !important;
      font-size: 0.92rem !important;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <span id="network-status">● Conectado</span>
      <div id="info-carr" class="user-pill hidden"></div>
    </div>
    <button id="btn-salir" class="btn-top hidden" onclick="cerrarSesion()">Cambiar nombre</button>
  </header>

  <div id="vista-login" class="card">
    <label for="input-nombre">Nombre</label>
    <input type="text" id="input-nombre" autocomplete="name">
    <div id="login-error" class="error-msg"></div>
    <button type="button" class="action-btn" onclick="entrar()">ENTRAR</button>
  </div>

  <div id="vista-cola" class="hidden">
    <div class="tabs-bar">
      <button type="button" id="tab-btn-cola" class="tab-btn activa" onclick="cambiarPestana('cola')">Cola de pedidos</button>
      <button type="button" id="tab-btn-opc" class="tab-btn" onclick="cambiarPestana('opc')">Apuntes OPC</button>
    </div>

    <div id="pestana-cola">
      <div class="seccion-titulo">
        <h3 style="margin:0;">Pendientes</h3>
        <span id="contador-pendientes" style="font-weight:900; color:var(--muted);">0 pendientes</span>
      </div>
      <div id="lista-carretillero"></div>

      <div class="seccion-titulo">
        <h3 style="margin:0;">Completados hoy</h3>
        <span id="contador-completados" style="font-weight:900; color:#4ade80;">0 listos</span>
      </div>
      <div id="lista-completados"></div>
    </div>

    <div id="pestana-opc" class="hidden">
      <div class="opc-tools-grid">
        <div class="opc-box">
          <h4>Añadir OPC nueva</h4>
          <div class="row-2">
            <div>
              <label for="nueva-opc-codigo" style="font-size:0.88rem;">OPC (4 dígitos)</label>
              <input type="text" id="nueva-opc-codigo" maxlength="4" inputmode="numeric" placeholder="Ej. 5450">
            </div>
            <div>
              <label for="nueva-opc-linea" style="font-size:0.88rem;">Línea (opcional)</label>
              <input type="text" id="nueva-opc-linea" inputmode="numeric" placeholder="Ej. 4">
            </div>
          </div>
          <button type="button" class="btn-sec" onclick="anadirOpcManual()">Añadir OPC</button>
        </div>

        <div class="opc-box">
          <h4>Añadir material manual a una OPC</h4>
          <div class="row-3">
            <div>
              <label for="mat-manual-opc" style="font-size:0.88rem;">OPC</label>
              <input type="text" id="mat-manual-opc" maxlength="4" inputmode="numeric" placeholder="5450">
            </div>
            <div>
              <label for="mat-manual-prefijo" style="font-size:0.88rem;">Prefijo</label>
              <select id="mat-manual-prefijo">
                <option value="">--</option>
                <option value="MP">MP</option>
                <option value="ST">ST</option>
                <option value="PT">PT</option>
              </select>
            </div>
            <div>
              <label for="mat-manual-ref" style="font-size:0.88rem;">Ref. (5 díg.)</label>
              <input type="text" id="mat-manual-ref" maxlength="5" inputmode="numeric" placeholder="12345">
            </div>
          </div>
          <div class="row-3">
            <div>
              <label for="mat-manual-cant" style="font-size:0.88rem;">Cantidad</label>
              <input type="number" id="mat-manual-cant" min="1" value="1">
            </div>
            <div>
              <label for="mat-manual-puestos" style="font-size:0.88rem;">Ya puestos</label>
              <input type="number" id="mat-manual-puestos" min="0" value="0">
            </div>
            <div>
              <label for="mat-manual-lote" style="font-size:0.88rem;">Lote</label>
              <input type="text" id="mat-manual-lote" placeholder="FIFO">
            </div>
          </div>
          <div style="margin-bottom:8px;">
            <label for="mat-manual-clase" style="font-size:0.88rem;">Tipo / descripción (si no hay ref. de 5 dígitos)</label>
            <input type="text" id="mat-manual-clase" placeholder="Ej. estuche, embalaje...">
          </div>
          <button type="button" class="btn-sec" onclick="anadirMaterialManual()">Guardar material en OPC</button>
        </div>
      </div>

      <div id="opc-msg-error" class="error-msg"></div>
      <div id="opc-msg-ok" class="ok-msg"></div>

      <div class="seccion-titulo">
        <h3 style="margin:0;">OPC recopiladas hoy</h3>
        <span id="contador-apuntes-opc" style="font-weight:900; color:#93c5fd;">0 OPC</span>
      </div>
      <div id="lista-apuntes-opc"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const STORAGE_APUNTES_MANUALES = 'apuntesOpcManualesCarr_v1';

  let sesionCarr = JSON.parse(localStorage.getItem('sesionCarretillero') || 'null');
  let pedidosHoyTodos = [];
  let pedidosPendientes = [];
  let pedidosCompletados = [];
  let idsConocidos = new Set();
  let primeraCarga = true;
  let audioCtx = null;
  let pestanaActual = 'cola';
  let opcsCompletadas = new Set(JSON.parse(localStorage.getItem('opcsCompletadasCarr') || '[]'));
  let apuntesManuales = cargarApuntesManualesLocal();
  let cargandoCarr = false;
  let ultimoRenderCarr = '';
  let ultimoRenderOpc = '';

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function hoyClaveLocal() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function cargarApuntesManualesLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_APUNTES_MANUALES) || 'null');
      if (!raw || raw.fecha !== hoyClaveLocal()) {
        return { fecha: hoyClaveLocal(), opcs: {} };
      }
      return { fecha: raw.fecha, opcs: raw.opcs || {} };
    } catch (_) {
      return { fecha: hoyClaveLocal(), opcs: {} };
    }
  }

  function guardarApuntesManualesLocal() {
    apuntesManuales.fecha = hoyClaveLocal();
    try {
      localStorage.setItem(STORAGE_APUNTES_MANUALES, JSON.stringify(apuntesManuales));
    } catch (_) {}
  }

  function mostrarMensajeOpc(tipo, texto) {
    const errEl = document.getElementById('opc-msg-error');
    const okEl = document.getElementById('opc-msg-ok');
    if (errEl) errEl.innerText = tipo === 'error' ? texto : '';
    if (okEl) okEl.innerText = tipo === 'ok' ? texto : '';
  }

  function asegurarEntradaOpcManual(opcCodigo, lineaNum = '') {
    if (apuntesManuales.fecha !== hoyClaveLocal()) {
      apuntesManuales = { fecha: hoyClaveLocal(), opcs: {} };
    }
    if (!apuntesManuales.opcs[opcCodigo]) {
      apuntesManuales.opcs[opcCodigo] = {
        opc: opcCodigo,
        ultimaFechaMs: Date.now(),
        lineas: lineaNum ? [`Línea ${lineaNum}`] : [],
        solicitantes: [sesionCarr?.nombre || 'Carretillero'],
        materiales: []
      };
    } else {
      apuntesManuales.opcs[opcCodigo].ultimaFechaMs = Date.now();
      if (lineaNum && !apuntesManuales.opcs[opcCodigo].lineas.includes(`Línea ${lineaNum}`)) {
        apuntesManuales.opcs[opcCodigo].lineas.push(`Línea ${lineaNum}`);
      }
    }
  }

  function anadirOpcManual() {
    const inputOpc = document.getElementById('nueva-opc-codigo');
    const inputLin = document.getElementById('nueva-opc-linea');
    const opcCod = (inputOpc?.value || '').replace(/\D/g, '').slice(0, 4);
    const linNum = (inputLin?.value || '').replace(/\D/g, '').trim();

    if (opcCod.length !== 4) {
      mostrarMensajeOpc('error', 'La OPC debe tener 4 dígitos.');
      return;
    }

    asegurarEntradaOpcManual(opcCod, linNum);
    guardarApuntesManualesLocal();

    const selectMatOpc = document.getElementById('mat-manual-opc');
    if (selectMatOpc) selectMatOpc.value = opcCod;
    if (inputOpc) inputOpc.value = '';
    if (inputLin) inputLin.value = '';

    mostrarMensajeOpc('ok', `OPC ${opcCod} añadida.`);
    ultimoRenderOpc = '';
    renderizarApuntesOpc();
  }

  function anadirMaterialManual() {
    const opcCod = (document.getElementById('mat-manual-opc')?.value || '').replace(/\D/g, '').slice(0, 4);
    const pref = (document.getElementById('mat-manual-prefijo')?.value || '').trim().toUpperCase();
    const ref = (document.getElementById('mat-manual-ref')?.value || '').replace(/\D/g, '').slice(0, 5);
    const cant = Math.max(1, parseInt(document.getElementById('mat-manual-cant')?.value, 10) || 1);
    const puestosIni = Math.max(0, parseInt(document.getElementById('mat-manual-puestos')?.value, 10) || 0);
    const loteTxt = ((document.getElementById('mat-manual-lote')?.value || '').trim() || 'FIFO');
    const claseTxt = (document.getElementById('mat-manual-clase')?.value || '').trim();

    if (opcCod.length !== 4) {
      mostrarMensajeOpc('error', 'Indica una OPC válida de 4 dígitos.');
      return;
    }

    const refValida = Boolean(pref && ref.length === 5);
    if (pref && ref.length > 0 && ref.length !== 5) {
      mostrarMensajeOpc('error', 'La referencia debe tener 5 dígitos.');
      return;
    }
    if (!refValida && !claseTxt) {
      mostrarMensajeOpc('error', 'Indica prefijo + 5 dígitos o un tipo/descripción de material.');
      return;
    }

    const nombreMat = [
      refValida ? `${pref}-${ref}` : '',
      claseTxt
    ].filter(Boolean).join(' · ');

    const loteNorm = loteTxt.toUpperCase() === 'FIFO' ? 'FIFO' : `Lote ${loteTxt}`;

    asegurarEntradaOpcManual(opcCod);
    const lista = apuntesManuales.opcs[opcCod].materiales;
    const clave = `${nombreMat.toLowerCase()}|${loteNorm.toLowerCase()}`;
    const existente = lista.find(m => `${m.nombre.toLowerCase()}|${m.lote.toLowerCase()}` === clave);

    if (existente) {
      existente.cantidadTotal += cant;
      existente.puestosTotal += puestosIni;
    } else {
      lista.push({
        id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        nombre: nombreMat,
        lote: loteNorm,
        cantidadTotal: cant,
        puestosTotal: puestosIni
      });
    }

    guardarApuntesManualesLocal();
    document.getElementById('mat-manual-ref').value = '';
    document.getElementById('mat-manual-clase').value = '';
    document.getElementById('mat-manual-puestos').value = '0';
    mostrarMensajeOpc('ok', `Material guardado en OPC ${opcCod}.`);
    ultimoRenderOpc = '';
    renderizarApuntesOpc();
  }

  function sumarPuestosEnOpc(opcCod, claveMatCodificada, cantidadExtra = 1) {
    const extra = Math.max(1, parseInt(cantidadExtra, 10) || 1);
    const nombreMat = decodeURIComponent(claveMatCodificada);

    asegurarEntradaOpcManual(opcCod);
    const grupoManual = apuntesManuales.opcs[opcCod];
    const matManual = grupoManual.materiales.find(
      m => m.nombre.toLowerCase() === nombreMat.toLowerCase()
    );

    if (matManual) {
      matManual.puestosTotal += extra;
      if (matManual.puestosTotal > matManual.cantidadTotal) {
        matManual.cantidadTotal = matManual.puestosTotal;
      }
    } else {
      grupoManual.materiales.push({
        id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        nombre: nombreMat,
        lote: 'FIFO',
        cantidadTotal: extra,
        puestosTotal: extra
      });
    }

    guardarApuntesManualesLocal();
    mostrarMensajeOpc('ok', `Sumados +${extra} puestos a ${nombreMat} (OPC ${opcCod}).`);
    ultimoRenderOpc = '';
    renderizarApuntesOpc();
  }

  function sumarPuestosDesdeInput(opcCod, claveMatCodificada, inputId) {
    const inp = document.getElementById(inputId);
    const val = Math.max(1, parseInt(inp?.value, 10) || 1);
    sumarPuestosEnOpc(opcCod, claveMatCodificada, val);
  }

  function inicioHoyISO() {
    const ahora = new Date();
    const inicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), 0, 0, 0, 0);
    return inicio.toISOString();
  }

  function codificarMetaEnMaterial(resumenBase, tiempoSel, venceMs, cantidadNum, puestosNum) {
    const limpio = String(resumenBase || 'Material').replace(/\s*\[\[META:[^\]]+\]\]\s*$/g, '').trim() || 'Material';
    const cant = Math.max(1, parseInt(cantidadNum, 10) || 1);
    const puestos = Math.max(0, Math.min(cant, parseInt(puestosNum, 10) || 0));
    const meta = {
      t: tiempoSel || null,
      v: venceMs || null,
      c: cant,
      u: puestos
    };
    return `${limpio} [[META:${btoa(unescape(encodeURIComponent(JSON.stringify(meta))))}]]`;
  }

  function extraerOpcDePedido(p) {
    if (p?.opc && String(p.opc).trim()) {
      return String(p.opc).trim();
    }
    const texto = `${p?.material || ''} ${p?.material_limpio || ''}`;
    const matchOpc = texto.match(/\bOPC\s*[:#-]?\s*(\d{4})\b/i);
    return matchOpc ? matchOpc[1] : '';
  }

  function decodificarPedidoConMeta(p) {
    const rawMat = String(p?.material || '');
    const match = rawMat.match(/\[\[META:([^\]]+)\]\]\s*$/);
    let meta = { t: null, v: null, c: 1, u: 0 };
    let materialLimpio = rawMat.trim();
    if (match) {
      materialLimpio = rawMat.replace(/\[\[META:[^\]]+\]\]\s*$/g, '').trim();
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(match[1].trim()))));
        const cantParseada = Math.max(1, parseInt(parsed.c, 10) || 1);
        const rawU = Math.max(0, parseInt(parsed.u, 10) || 0);
        const puestosParseados = p.estado === 'completado'
          ? cantParseada
          : Math.min(cantParseada, rawU);
        meta = {
          t: parsed.t || null,
          v: parsed.v ? Number(parsed.v) : null,
          c: cantParseada,
          u: puestosParseados
        };
      } catch (_) {}
    } else if (p?.estado === 'completado') {
      meta.u = 1;
    }

    const estadoEfectivo = (p.estado === 'completado' || meta.u >= meta.c)
      ? 'completado'
      : p.estado;

    return {
      ...p,
      estado: estadoEfectivo,
      material_limpio: materialLimpio,
      tiempo_aviso: p.tiempo_aviso || meta.t,
      vence_en: p.vence_en || (meta.v ? new Date(meta.v).toISOString() : null),
      vence_ms: p.vence_en ? new Date(p.vence_en).getTime() : meta.v,
      cantidad: Math.max(1, parseInt(meta.c || p.cantidad || 1, 10) || 1),
      puestos: estadoEfectivo === 'completado' ? Math.max(1, parseInt(meta.c || p.cantidad || 1, 10) || 1) : meta.u
    };
  }

  function cambiarPestana(nuevaPestana) {
    pestanaActual = nuevaPestana;
    document.getElementById('tab-btn-cola').classList.toggle('activa', nuevaPestana === 'cola');
    document.getElementById('tab-btn-opc').classList.toggle('activa', nuevaPestana === 'opc');
    document.getElementById('pestana-cola').classList.toggle('hidden', nuevaPestana !== 'cola');
    document.getElementById('pestana-opc').classList.toggle('hidden', nuevaPestana !== 'opc');

  function guardarOpcsCompletadasLocal() {
    try {
      localStorage.setItem('opcsCompletadasCarr', JSON.stringify([...opcsCompletadas]));
    } catch (_) {}
  }

  function alternarOpcCompletada(opcCodigo) {
    const clave = String(opcCodigo || '').trim();
    if (!clave) return;
    if (opcsCompletadas.has(clave)) {
      opcsCompletadas.delete(clave);
    } else {
      opcsCompletadas.add(clave);
    }
    guardarOpcsCompletadasLocal();
    ultimoRenderOpc = '';
    renderizarApuntesOpc();
  }

  function esPedidoConTiempo(p) {
    return Boolean(p && (p.tiempo_aviso || p.vence_ms));
  }

  function estaVencidoTiempo(p) {
    if (!esPedidoConTiempo(p)) return true;
    const ms = p.vence_ms || (p.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return true;
    return Date.now() >= ms;
  }

  function formatearHoraVencimiento(p) {
    const ms = p?.vence_ms || (p?.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return '';
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function ordenarPendientesCarretillero(lista) {
    const sinTiempo = lista.filter(p => !esPedidoConTiempo(p));
    const conTiempoVencido = lista.filter(p => esPedidoConTiempo(p) && estaVencidoTiempo(p));
    const conTiempoFuturo = lista.filter(p => esPedidoConTiempo(p) && !estaVencidoTiempo(p));

    const normales = [...sinTiempo, ...conTiempoVencido].sort(
      (a, b) => new Date(a.creado_en).getTime() - new Date(b.creado_en).getTime()
    );

    conTiempoFuturo.sort((a, b) => {
      const va = a.vence_ms || (a.vence_en ? new Date(a.vence_en).getTime() : Number.MAX_SAFE_INTEGER);
      const vb = b.vence_ms || (b.vence_en ? new Date(b.vence_en).getTime() : Number.MAX_SAFE_INTEGER);
      if (va !== vb) return va - vb;
      return new Date(a.creado_en).getTime() - new Date(b.creado_en).getTime();
    });

    return [...normales, ...conTiempoFuturo];
  }

  function sonarPitidoFuerte() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      const ahora = audioCtx.currentTime;
      const tonos = [
        [880, ahora, 0.22],
        [1174, ahora + 0.25, 0.26]
      ];
      tonos.forEach(([freq, start, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.45, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      });
    } catch (_) {}
  }

  function solicitarPermisoNotificacionEnSegundoPlano() {
    try {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});

  function actualizarEstadoRed(online) {
    const badge = document.getElementById('network-status');
    const txt = online ? '● Conectado' : '● Sin cobertura';
    const cls = online ? '' : 'offline';
    if (badge.innerText !== txt) badge.innerText = txt;
    if (badge.className !== cls) badge.className = cls;
  }

  function emitirNotificacion(titulo, cuerpo) {
    sonarPitidoFuerte();
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(titulo, {
              body: cuerpo,
              tag: 'nuevo-pedido-palets',
              renotify: true
            });
          }).catch(() => {
            new Notification(titulo, { body: cuerpo });
          });
        } else {
          new Notification(titulo, { body: cuerpo });
        }
      }
    } catch (_) {}
  }

  function tieneLoteConcreto(p) {
    return Boolean(p.lote && p.lote.trim() && p.lote.trim().toUpperCase() !== 'FIFO');
  }

  function obtenerCantidadPedido(p) {
    return Math.max(1, Number(p?.cantidad) || 1);
  }

  function obtenerPuestosPedido(p) {
    const cant = obtenerCantidadPedido(p);
    if (p?.estado === 'completado') return cant;
    return Math.max(0, Math.min(cant, Number(p?.puestos) || 0));
  }

  function formatearTituloPedido(p) {
    const opcCod = extraerOpcDePedido(p);
    const refFmt = p.num_referencia ? (p.tipo_material ? `${p.tipo_material}-${p.num_referencia}` : p.num_referencia) : '';
    const cant = obtenerCantidadPedido(p);
    const cantTxt = cant > 1 ? `x${cant}` : '';
    const partes = [refFmt, opcCod ? `OPC ${opcCod}` : '', p.clase_material || '', cantTxt].filter(Boolean);
    const base = partes.length > 0 ? partes.join(' · ') : (p.material_limpio || p.material || 'Material');
    if (tieneLoteConcreto(p)) {
      return `${base} · Lote ${p.lote.trim()}`;
    }
    return base;
  }

  async function cogerUnaUnidad(id) {
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    if (!pedido) return;
    const cant = obtenerCantidadPedido(pedido);
    const nuevosPuestos = Math.min(cant, obtenerPuestosPedido(pedido) + 1);
    const completadoAhora = nuevosPuestos >= cant;

    const nuevoMaterial = codificarMetaEnMaterial(
      pedido.material_limpio || pedido.material || 'Material',
      pedido.tiempo_aviso,
      pedido.vence_ms,
      cant,
      nuevosPuestos
    );

    const { error } = await db
      .from('pedidos')
      .update({
        material: nuevoMaterial,
        estado: completadoAhora ? 'completado' : 'pendiente'
      })
      .eq('id', id);

    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function marcarListo(id) {
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    const cant = pedido ? obtenerCantidadPedido(pedido) : 1;
    const nuevoMaterial = pedido
      ? codificarMetaEnMaterial(
          pedido.material_limpio || pedido.material || 'Material',
          pedido.tiempo_aviso,
          pedido.vence_ms,
          cant,
          cant
        )
      : undefined;

    const updatePayload = nuevoMaterial
      ? { estado: 'completado', material: nuevoMaterial }
      : { estado: 'completado' };

    const { error } = await db.from('pedidos').update(updatePayload).eq('id', id);
    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function desmarcarPedido(id) {
    const confirmar = confirm('AVISO: Vas a desmarcar este pedido marcado como LISTO y volverá a aparecer como PENDIENTE. ¿Quieres continuar?');
    if (!confirmar) return;
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    const cant = pedido ? obtenerCantidadPedido(pedido) : 1;
    const puestosReset = cant > 1 ? Math.max(0, cant - 1) : 0;
    const nuevoMaterial = pedido
      ? codificarMetaEnMaterial(
          pedido.material_limpio || pedido.material || 'Material',
          pedido.tiempo_aviso,
          pedido.vence_ms,
          cant,
          puestosReset
        )
      : undefined;

    const updatePayload = nuevoMaterial
      ? { estado: 'pendiente', material: nuevoMaterial }
      : { estado: 'pendiente' };

    const { error } = await db.from('pedidos').update(updatePayload).eq('id', id);
    if (!error) {
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  async function cargarPedidos() {
    if (!sesionCarr || cargandoCarr) return;
    cargandoCarr = true;
    try {
      const { data, error } = await db
        .from('pedidos')
        .select('*')
        .neq('estado', 'cancelado')
        .gte('creado_en', inicioHoyISO())
        .order('creado_en', { ascending: true });

      if (!error && data) {
        const normalizados = data.map(decodificarPedidoConMeta);
        for (const p of normalizados) {
          if (p.estado === 'completado' && p.puestos >= p.cantidad) {
            const raw = data.find(r => r.id === p.id);
            if (raw && raw.estado !== 'completado') {
              await db.from('pedidos').update({
                estado: 'completado',
                material: codificarMetaEnMaterial(p.material_limpio, p.tiempo_aviso, p.vence_ms, p.cantidad, p.cantidad)
              }).eq('id', p.id);
            }
          }
        }

        const pendientes = ordenarPendientesCarretillero(normalizados.filter(p => p.estado !== 'completado'));
        const completados = normalizados.filter(p => p.estado === 'completado').reverse();

        if (!primeraCarga) {
          pendientes.forEach(p => {
            if (!idsConocidos.has(p.id)) {
              const extraHora = esPedidoConTiempo(p) ? ` · Necesario ${formatearHoraVencimiento(p)}` : '';
              emitirNotificacion(
                `${p.linea}${extraHora}`,
                `${formatearTituloPedido(p)} (${p.solicitado_por || ''})`
              );
            }
          });
        }

        idsConocidos = new Set(pendientes.map(p => p.id));
        primeraCarga = false;
        pedidosHoyTodos = normalizados;
        pedidosPendientes = pendientes;
        pedidosCompletados = completados;
        renderizarCarretillero();
        renderizarApuntesOpc();
        actualizarEstadoRed(true);
      } else if (error) {
        actualizarEstadoRed(false);
      }
    } finally {
      cargandoCarr = false;
    }
  }

  function obtenerGruposOpcRelevantes() {
    const mapaOpc = new Map();

    pedidosHoyTodos.forEach(p => {
      const codigoOpc = extraerOpcDePedido(p);
      if (!codigoOpc) return;

      const cant = obtenerCantidadPedido(p);
      const puestos = obtenerPuestosPedido(p);
      const refFmt = p.num_referencia ? (p.tipo_material ? `${p.tipo_material}-${p.num_referencia}` : p.num_referencia) : '';
      const nombreMat = [refFmt, p.clase_material || ''].filter(Boolean).join(' · ') || (p.material_limpio || 'Material');
      const loteTxt = (p.lote && p.lote !== 'FIFO') ? `Lote ${p.lote}` : 'FIFO';

      if (!mapaOpc.has(codigoOpc)) {
        mapaOpc.set(codigoOpc, {
          opc: codigoOpc,
          ultimaFechaMs: new Date(p.creado_en).getTime(),
          lineas: new Set(),
          solicitantes: new Set(),
          materialesMap: new Map()
        });
      }

      const grupo = mapaOpc.get(codigoOpc);
      const fechaMs = new Date(p.creado_en).getTime();
      if (fechaMs > grupo.ultimaFechaMs) grupo.ultimaFechaMs = fechaMs;
      if (p.linea) grupo.lineas.add(p.linea);
      if (p.solicitado_por) grupo.solicitantes.add(p.solicitado_por);

      const claveMat = `${nombreMat.toLowerCase()}|${loteTxt.toLowerCase()}`;
      if (!grupo.materialesMap.has(claveMat)) {
        grupo.materialesMap.set(claveMat, {
          nombre: nombreMat,
          lote: loteTxt,
          cantidadTotal: cant,
          puestosTotal: puestos
        });
      } else {
        const matEntry = grupo.materialesMap.get(claveMat);
        matEntry.cantidadTotal += cant;
        matEntry.puestosTotal += puestos;
      }
    });

    if (apuntesManuales.fecha === hoyClaveLocal()) {
      Object.values(apuntesManuales.opcs || {}).forEach(man => {
        const codigoOpc = String(man.opc || '').trim();
        if (!codigoOpc) return;

        if (!mapaOpc.has(codigoOpc)) {
          mapaOpc.set(codigoOpc, {
            opc: codigoOpc,
            ultimaFechaMs: man.ultimaFechaMs || Date.now(),
            lineas: new Set(man.lineas || []),
            solicitantes: new Set(man.solicitantes || []),
            materialesMap: new Map()
          });
        }

        const grupo = mapaOpc.get(codigoOpc);
        if ((man.ultimaFechaMs || 0) > grupo.ultimaFechaMs) {
          grupo.ultimaFechaMs = man.ultimaFechaMs;
        }
        (man.lineas || []).forEach(l => grupo.lineas.add(l));
        (man.solicitantes || []).forEach(s => grupo.solicitantes.add(s));

        (man.materiales || []).forEach(m => {
          const claveMat = `${(m.nombre || '').toLowerCase()}|${(m.lote || 'FIFO').toLowerCase()}`;
          if (!grupo.materialesMap.has(claveMat)) {
            grupo.materialesMap.set(claveMat, {
              nombre: m.nombre,
              lote: m.lote || 'FIFO',
              cantidadTotal: Number(m.cantidadTotal) || 0,
              puestosTotal: Number(m.puestosTotal) || 0
            });
          } else {
            const matEntry = grupo.materialesMap.get(claveMat);
            matEntry.cantidadTotal += Number(m.cantidadTotal) || 0;
            matEntry.puestosTotal += Number(m.puestosTotal) || 0;
          }
        });
      });
    }

    return [...mapaOpc.values()]
      .map(g => ({
        opc: g.opc,
        ultimaFechaMs: g.ultimaFechaMs,
        lineas: [...g.lineas],
        solicitantes: [...g.solicitantes],
        materiales: [...g.materialesMap.values()]
      }))
      .sort((a, b) => b.ultimaFechaMs - a.ultimaFechaMs);
  }

  function renderizarApuntesOpc() {
    const cont = document.getElementById('lista-apuntes-opc');
    const badge = document.getElementById('contador-apuntes-opc');
    if (!cont || !badge) return;

    const grupos = obtenerGruposOpcRelevantes();
    const badgeTxt = `${grupos.length} OPC`;
    if (badge.innerText !== badgeTxt) badge.innerText = badgeTxt;

    const firma = JSON.stringify({
      done: [...opcsCompletadas],
      grupos
    });
    if (firma === ultimoRenderOpc) return;
    ultimoRenderOpc = firma;

    if (grupos.length === 0) {
      cont.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin OPC registradas hoy.</p>';
      return;
    }

    cont.innerHTML = grupos.map((g, gIdx) => {
      const hecha = opcsCompletadas.has(g.opc);
      const hora = new Date(g.ultimaFechaMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const metaSup = [hora, g.lineas.join(', '), g.solicitantes.join(', ')].filter(Boolean).join(' · ');

      const itemsHtml = g.materiales.length === 0
        ? '<li class="opc-mat-row"><span>Sin materiales apuntados aún</span></li>'
        : g.materiales.map((m, mIdx) => {
            const cantMostrada = Math.max(m.cantidadTotal, m.puestosTotal);
            const detalleCant = cantMostrada > 1 || m.puestosTotal > 0
              ? ` — <strong>Puestos: ${m.puestosTotal}/${cantMostrada}</strong>`
              : '';
            const matCod = encodeURIComponent(m.nombre);
            const inpId = `sumar-inp-${gIdx}-${mIdx}`;

            return `
              <li class="opc-mat-row">
                <span>${m.nombre}${detalleCant} (${m.lote})</span>
                <div class="opc-mat-acciones">
                  <button type="button" class="btn-verde-sm" onclick="sumarPuestosEnOpc('${g.opc}', '${matCod}', 1)">+1 puesto</button>
                  <input type="number" id="${inpId}" class="input-sumar-puestos" min="1" value="1">
                  <button type="button" class="btn-azul-sm" onclick="sumarPuestosDesdeInput('${g.opc}', '${matCod}', '${inpId}')">Sumar</button>
                </div>
              </li>
            `;
          }).join('');

      return `
        <div class="opc-apunte-item ${hecha ? 'hecho-apunte' : ''}">
          <div class="pedido-cuerpo">
            <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">${metaSup}</div>
            <div class="pedido-titulo">OPC ${g.opc}</div>
            <ul class="opc-mat-list">${itemsHtml}</ul>
            <span class="badge ${hecha ? 'listo' : ''}">${hecha ? 'OPC completada' : 'OPC pendiente'}</span>
          </div>
          <div class="acciones-carr">
            <button type="button" class="${hecha ? 'btn-desmarcar' : 'btn-hecho'}" onclick="alternarOpcCompletada('${g.opc}')">
              ${hecha ? 'Desmarcar OPC' : 'Marcar OPC completada ✓'}
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderizarCarretillero() {
    const lista = document.getElementById('lista-carretillero');
    const listaComp = document.getElementById('lista-completados');
    const pendBadge = document.getElementById('contador-pendientes');
    const compBadge = document.getElementById('contador-completados');

    const pendTxt = `${pedidosPendientes.length} pendientes`;
    const compTxt = `${pedidosCompletados.length} listos`;
    if (pendBadge.innerText !== pendTxt) pendBadge.innerText = pendTxt;
    if (compBadge.innerText !== compTxt) compBadge.innerText = compTxt;

    const minutoClave = Math.floor(Date.now() / 60000);
    const firma = JSON.stringify({
      m: minutoClave,
      p: pedidosPendientes.map(x => [x.id, x.material, x.lote, x.linea, x.solicitado_por, x.puestos, x.cantidad]),
      c: pedidosCompletados.map(x => [x.id, x.material, x.lote, x.linea, x.solicitado_por, x.puestos, x.cantidad])
    });
    if (firma === ultimoRenderCarr) return;
    ultimoRenderCarr = firma;

    if (pedidosPendientes.length === 0) {
      lista.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin pedidos pendientes.</p>';
    } else {
      lista.innerHTML = pedidosPendientes.map((p, index) => {
        const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const titulo = formatearTituloPedido(p);
        const cant = obtenerCantidadPedido(p);
        const puestos = obtenerPuestosPedido(p);
        const quedan = Math.max(0, cant - puestos);
        const subPartes = [];
        if (!tieneLoteConcreto(p)) subPartes.push('FIFO');
        if (p.solicitado_por) subPartes.push(p.solicitado_por);

        const conTiempo = esPedidoConTiempo(p);
        const vencido = estaVencidoTiempo(p);
        const horaVence = formatearHoraVencimiento(p);
        const cantHtml = cant > 1
          ? `<div class="pedido-cant-info">Cantidad pedida: ${cant} · Puestos: ${puestos} · Quedan: ${quedan}</div>`
          : '';

        const accionHtml = cant > 1
          ? `<button type="button" class="btn-coger-uno" onclick="cogerUnaUnidad(${p.id})">Coger 1 (${quedan} rest.)</button>`
          : `<button type="button" class="btn-hecho" onclick="marcarListo(${p.id})">Listo ✓</button>`;

        return `
          <div class="pedido-item ${(conTiempo && !vencido) ? 'con-tiempo-futuro' : ''}">
            <div class="pedido-cuerpo">
              <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">#${index + 1} · ${hora} · ${p.linea}</div>
              <div class="pedido-titulo">${titulo}</div>
              ${cantHtml}
              ${subPartes.length > 0 ? `<div style="font-size:0.92rem; color:#cbd5e1; font-weight:700;">${subPartes.join(' · ')}</div>` : ''}
              <span class="badge">Pendiente</span>
              ${conTiempo ? `<span class="badge tiempo">${p.tiempo_aviso} · Hora exacta: ${horaVence}${vencido ? ' (En hora)' : ' (Programado)'}</span>` : ''}
            </div>
            <div class="acciones-carr">
              ${accionHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    if (pedidosCompletados.length === 0) {
      listaComp.innerHTML = '<p style="color:var(--muted); font-weight:800;">Sin pedidos completados hoy.</p>';
    } else {
      listaComp.innerHTML = pedidosCompletados.map((p) => {
        const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const titulo = formatearTituloPedido(p);
        const cant = obtenerCantidadPedido(p);
        const subPartes = [];
        if (cant > 1) subPartes.push(`Cantidad pedida: ${cant}`, `Puestos: ${cant}`);
        if (!tieneLoteConcreto(p)) subPartes.push('FIFO');
        if (p.solicitado_por) subPartes.push(p.solicitado_por);

        return `
          <div class="pedido-item completado">
            <div class="pedido-cuerpo">
              <div style="font-size:0.88rem; color:var(--muted); font-weight:800;">${hora} · ${p.linea}</div>
              <div class="pedido-titulo">${titulo}</div>
              ${subPartes.length > 0 ? `<div style="font-size:0.92rem; color:#cbd5e1; font-weight:700;">${subPartes.join(' · ')}</div>` : ''}
              <span class="badge listo">Listo</span>
            </div>
            <div class="acciones-carr">
              <button type="button" class="btn-desmarcar" onclick="desmarcarPedido(${p.id})">Desmarcar</button>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  db.channel('cambios-pedidos-carr')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
      cargarPedidos();
    })
    .subscribe();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sesionCarr) {
      ultimoRenderCarr = '';
      ultimoRenderOpc = '';
      cargarPedidos();
    }
  });

  setInterval(() => {
    if (sesionCarr && document.visibilityState === 'visible') {
      pedidosPendientes = ordenarPendientesCarretillero(pedidosPendientes);
      renderizarCarretillero();
      cargarPedidos();
    }
  }, 6500);

  if (sesionCarr) {
    mostrarCola();
  }
</script>
</body>
</html>
