<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets - Operaria</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 12px;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }
    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      font-weight: 900;
    }
    .pill-status {
      font-size: 0.88rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
    }
    .pill-status.offline {
      background: #d9770633;
      color: #fbbf24;
    }
    .user-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #e2e8f0;
      background: var(--card);
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .btn-top {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 9px 13px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70dvh;
    }
    .login-card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    /* Apaisado / horizontal por defecto en pantallas y tablets */
    .main-grid {
      display: grid;
      grid-template-columns: minmax(340px, 1.15fr) minmax(320px, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 560px) {
      .row-2 {
        grid-template-columns: 1fr;
      }
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    label {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--muted);
    }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
    }
    input:focus, select:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    /* Referencia: ST / MP / PT justo al lado del número */
    .ref-inline {
      display: grid;
      grid-template-columns: auto auto minmax(110px, 1fr);
      gap: 6px;
      align-items: stretch;
    }
    @media (max-width: 480px) {
      .ref-inline {
        grid-template-columns: repeat(3, 1fr);
      }
      .ref-inline input {
        grid-column: 1 / -1;
      }
    }
    .mat-tab {
      padding: 11px 14px;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      cursor: pointer;
    }
    .mat-tab.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: #fff;
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.95rem;
      font-weight: 800;
      min-height: 20px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 11px;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .btn-cancel-edit {
      width: 100%;
      padding: 9px;
      font-size: 0.92rem;
      font-weight: 800;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .resumen-turno {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.98rem;
      font-weight: 700;
    }
    .cola-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 68dvh;
      overflow-y: auto;
    }
    .pedido-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 6px solid var(--warning);
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pedido-card.es-mio {
      background: #172554;
      border-color: #3b82f6;
      border-left-color: #60a5fa;
    }
    .pedido-card.en_camino {
      border-left-color: var(--success);
    }
    .pedido-main {
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1.25;
    }
    .pedido-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 4px;
      margin-top: 4px;
    }
    .tag.pendiente { background: #d9770644; color: #fbbf24; }
    .tag.en_camino { background: #16a34a44; color: #4ade80; }
    .tag.mio { background: #2563eb66; color: #bfdbfe; }

    .acciones-card {
      display: flex;
      gap: 6px;
    }
    .btn-mini {
      border: none;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .btn-mod { background: #475569; }
    .btn-can { background: var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-shell">
  <header>
    <div class="header-left">
      <h1>PALETS · OPERARIA</h1>
      <span id="network-status" class="pill-status">● Conectado</span>
      <span id="user-badge" class="user-badge hidden"></span>
    </div>
    <button id="btn-cambiar" class="btn-top hidden" onclick="salirTurno()">Cambiar nombre</button>
  </header>

  <!-- SOLO NOMBRE AL ENTRAR -->
  <div id="vista-inicio" class="login-wrap">
    <div class="login-card">
      <h2 style="margin:0 0 12px 0; font-size:1.35rem;">Acceso Operaria</h2>
      <div class="field">
        <label for="input-nombre">Nombre</label>
        <input type="text" id="input-nombre" placeholder="Escribe tu nombre" autocomplete="off">
      </div>
      <div id="inicio-error" class="error-msg"></div>
      <button type="button" class="btn-submit" onclick="iniciarTurno()">ENTRAR</button>
    </div>
  </div>

  <!-- PANTALLA DE TRABAJO -->
  <div id="vista-trabajo" class="main-grid hidden">
    <section class="panel">
      <h2 id="titulo-form" class="panel-title">Nueva petición</h2>

      <div class="row-2">
        <div class="field">
          <label for="input-linea">Línea</label>
          <input type="text" id="input-linea" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="Nº línea">
        </div>

        <div class="field">
          <label for="input-opc">4 últimos dígitos</label>
          <input type="text" id="input-opc" inputmode="numeric" pattern="\d{4}" maxlength="4" enterkeyhint="done" placeholder="Ej. 4821">
        </div>
      </div>

      <div class="field">
        <label for="input-num-ref">Referencia</label>
        <div class="ref-inline">
          <button type="button" class="mat-tab" data-mat="ST" onclick="seleccionarPrefijo('ST')">ST</button>
          <button type="button" class="mat-tab" data-mat="MP" onclick="seleccionarPrefijo('MP')">MP</button>
          <button type="button" class="mat-tab" data-mat="PT" onclick="seleccionarPrefijo('PT')">PT</button>
          <input type="text" id="input-num-ref" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="Número">
        </div>
      </div>

      <div id="bloque-tipo-material" class="row-2 hidden">
        <div class="field">
          <label for="select-clase-mat">Material</label>
          <select id="select-clase-mat" onchange="alCambiarClaseMaterial()">
            <option value="">Selecciona...</option>
            <option value="lámina">lámina</option>
            <option value="interior">interior</option>
            <option value="posicionador">posicionador</option>
            <option value="sin estuchar">sin estuchar</option>
            <option value="sin encelofanar">sin encelofanar</option>
            <option value="estuche">estuche</option>
            <option value="embalaje">embalaje</option>
            <option value="embalaje inner">embalaje inner</option>
            <option value="otro">otro</option>
          </select>
        </div>

        <div id="campo-otro-mat" class="field hidden">
          <label for="input-otro-mat">Especificar material</label>
          <input type="text" id="input-otro-mat" enterkeyhint="done" placeholder="Escribe el material">
        </div>
      </div>

      <div class="field">
        <label for="input-lote">Lote</label>
        <input type="text" id="input-lote" enterkeyhint="done" placeholder="Lote">
      </div>

      <div id="form-error" class="error-msg"></div>
      <button type="button" class="btn-submit" id="btn-guardar" onclick="guardarPedido()">SOLICITAR</button>
      <button type="button" id="btn-cancelar-edicion" class="btn-cancel-edit hidden" onclick="cancelarEdicion()">Cancelar edición</button>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span>Pedidos activos</span>
        <span id="contador-general" style="font-size:0.95rem; color:#93c5fd;">0 activos</span>
      </div>

      <div id="resumen-posicion" class="resumen-turno">Indica tu línea para ver tu turno.</div>

      <div id="lista-general" class="cola-lista"></div>
    </section>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  localStorage.removeItem('colaOfflineOperaria');

  let sesionOp = JSON.parse(sessionStorage.getItem('sesionOperariaNombre') || 'null');
  let prefijoSeleccionado = '';
  let idEditando = null;
  let pedidosActivos = [];
  let colaOffline = [];
  let cargando = false;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function iniciarTurno() {
    const nombre = document.getElementById('input-nombre').value.trim();
    const err = document.getElementById('inicio-error');
    if (!nombre) {
      err.innerText = 'Escribe tu nombre para entrar.';
      return;
    }
    err.innerText = '';
    sesionOp = { nombre };
    sessionStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
    mostrarTrabajo();
  }

  function salirTurno() {
    sessionStorage.removeItem('sesionOperariaNombre');
    sesionOp = null;
    cancelarEdicion();
    document.getElementById('vista-trabajo').classList.add('hidden');
    document.getElementById('vista-inicio').classList.remove('hidden');
    document.getElementById('user-badge').classList.add('hidden');
    document.getElementById('btn-cambiar').classList.add('hidden');
  }

  function mostrarTrabajo() {
    if (!sesionOp) return;
    document.getElementById('vista-inicio').classList.add('hidden');
    document.getElementById('vista-trabajo').classList.remove('hidden');
    const badge = document.getElementById('user-badge');
    badge.classList.remove('hidden');
    badge.innerText = sesionOp.nombre;
    document.getElementById('btn-cambiar').classList.remove('hidden');
    cargarPedidos();
  }

  // Cierra teclado numérico al pulsar aceptar / enter
  function cerrarTecladoAlAceptar(inputEl) {
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        inputEl.blur();
      }
    });
  }

  const inputLinea = document.getElementById('input-linea');
  const inputOpc = document.getElementById('input-opc');
  const inputNumRef = document.getElementById('input-num-ref');
  const inputOtroMat = document.getElementById('input-otro-mat');
  const inputLote = document.getElementById('input-lote');

  [inputLinea, inputOpc, inputNumRef, inputOtroMat, inputLote].forEach(cerrarTecladoAlAceptar);

  inputLinea.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
    renderizarTodo();
  });
  inputOpc.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  inputNumRef.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
    actualizarVisibilidadClaseMaterial();
  });

  function seleccionarPrefijo(pref) {
    prefijoSeleccionado = (prefijoSeleccionado === pref) ? '' : pref;
    document.querySelectorAll('.mat-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mat === prefijoSeleccionado);
    });
    actualizarVisibilidadClaseMaterial();
    inputNumRef.focus();
  }

  function actualizarVisibilidadClaseMaterial() {
    const tieneRef = Boolean(inputNumRef.value.trim() || prefijoSeleccionado);
    document.getElementById('bloque-tipo-material').classList.toggle('hidden', !tieneRef);
    if (!tieneRef) {
      document.getElementById('select-clase-mat').value = '';
      inputOtroMat.value = '';
      document.getElementById('campo-otro-mat').classList.add('hidden');
    }
  }

  function alCambiarClaseMaterial() {
    const sel = document.getElementById('select-clase-mat').value;
    const esOtro = sel === 'otro';
    document.getElementById('campo-otro-mat').classList.toggle('hidden', !esOtro);
    if (esOtro) {
      inputOtroMat.focus();
    }
  }

  function obtenerClaseMaterialFinal() {
    const sel = document.getElementById('select-clase-mat').value;
    if (sel === 'otro') return inputOtroMat.value.trim();
    return sel.trim();
  }

  function actualizarEstadoRed(online) {
    const badge = document.getElementById('network-status');
    badge.innerText = online ? '● Conectado' : '● Sin cobertura';
    badge.className = online ? 'pill-status' : 'pill-status offline';
  }

  function limpiarFormulario() {
    idEditando = null;
    document.getElementById('titulo-form').innerText = 'Nueva petición';
    document.getElementById('btn-guardar').innerText = 'SOLICITAR';
    document.getElementById('btn-cancelar-edicion').classList.add('hidden');
    inputOpc.value = '';
    inputNumRef.value = '';
    inputLote.value = '';
    inputOtroMat.value = '';
    document.getElementById('select-clase-mat').value = '';
    document.getElementById('campo-otro-mat').classList.add('hidden');
    document.getElementById('bloque-tipo-material').classList.add('hidden');
    prefijoSeleccionado = '';
    document.querySelectorAll('.mat-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('form-error').innerText = '';
  }

  function cancelarEdicion() {
    limpiarFormulario();
  }

  function empezarEdicion(pedido) {
    idEditando = pedido.id;
    document.getElementById('titulo-form').innerText = `Modificando #${pedido.id} (vuelve a cola)`;
    document.getElementById('btn-guardar').innerText = 'GUARDAR Y VOLVER A COLA';
    document.getElementById('btn-cancelar-edicion').classList.remove('hidden');

    inputLinea.value = (pedido.linea || '').replace(/\D/g, '') || inputLinea.value;
    inputOpc.value = pedido.opc || '';
    inputNumRef.value = pedido.num_referencia || '';
    inputLote.value = (pedido.lote && pedido.lote !== 'FIFO') ? pedido.lote : '';

    prefijoSeleccionado = pedido.tipo_material || '';
    document.querySelectorAll('.mat-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.mat === prefijoSeleccionado);
    });

    actualizarVisibilidadClaseMaterial();
    const claseGuardada = pedido.clase_material || '';
    const opcionesPredefinidas = ['lámina','interior','posicionador','sin estuchar','sin encelofanar','estuche','embalaje','embalaje inner'];
    if (claseGuardada) {
      if (opcionesPredefinidas.includes(claseGuardada)) {
        document.getElementById('select-clase-mat').value = claseGuardada;
        document.getElementById('campo-otro-mat').classList.add('hidden');
      } else {
        document.getElementById('select-clase-mat').value = 'otro';
        document.getElementById('campo-otro-mat').classList.remove('hidden');
        inputOtroMat.value = claseGuardada;
      }
    }
  }

  function claveMaterial(item) {
    const tipo = (item.tipo_material || '').toUpperCase();
    const num = (item.num_referencia || '').trim();
    const clase = (item.clase_material || '').trim().toLowerCase();
    const opc = (item.opc || '').trim();
    const lote = (item.lote || 'FIFO').trim().toUpperCase();
    return `${tipo}|${num}|${clase}|${opc}|${lote}`;
  }

  function existeMaterialDuplicado(linea, candidato, excluirId = null) {
    const claveNueva = claveMaterial(candidato);
    const activosEnLinea = pedidosActivos.filter(p => p.linea === linea && p.id !== excluirId);
    const enColaLocal = colaOffline.filter(p => p.linea === linea);
    return [...activosEnLinea, ...enColaLocal].some(p => claveMaterial(p) === claveNueva);
  }

  async function guardarPedido() {
    const err = document.getElementById('form-error');
    const numLinea = inputLinea.value.trim();
    const opc = inputOpc.value.trim();
    const numRef = inputNumRef.value.trim();
    const loteInput = inputLote.value.trim();

    if (!numLinea) {
      err.innerText = 'Indica el número de línea.';
      return;
    }
    if (opc && opc.length !== 4) {
      err.innerText = 'La OPC debe tener 4 dígitos.';
      return;
    }

    const tieneRef = Boolean(numRef || prefijoSeleccionado);
    if (!opc && !tieneRef) {
      err.innerText = 'Indica 4 últimos dígitos de OPC o bien Referencia.';
      return;
    }

    let claseMaterial = '';
    if (tieneRef) {
      if (!prefijoSeleccionado || !numRef) {
        err.innerText = 'Marca ST, MP o PT y escribe el número de referencia.';
        return;
      }
      claseMaterial = obtenerClaseMaterialFinal();
      if (!claseMaterial) {
        err.innerText = 'Selecciona el material (o escríbelo si elegiste otro).';
        return;
      }
    }

    const lineaTexto = `Línea ${numLinea}`;
    const refTexto = tieneRef ? `${prefijoSeleccionado}-${numRef}` : '';
    const resumenMaterial = [refTexto, opc ? `OPC ${opc}` : '', claseMaterial]
      .filter(Boolean)
      .join(' · ') || 'Pedido';

    const payload = {
      linea: lineaTexto,
      material: resumenMaterial,
      solicitado_por: sesionOp ? sesionOp.nombre : 'Operaria',
      opc: opc || null,
      tipo_material: tieneRef ? prefijoSeleccionado : null,
      num_referencia: tieneRef ? numRef : null,
      clase_material: tieneRef ? claseMaterial : null,
      lote: loteInput || 'FIFO',
      estado: 'pendiente',
      creado_en: new Date().toISOString()
    };

    if (existeMaterialDuplicado(lineaTexto, payload, idEditando)) {
      err.innerText = 'Ya hay ese mismo material pedido en esta línea.';
      return;
    }

    err.innerText = '';
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;

    if (idEditando) {
      const { error } = await db.from('pedidos').update(payload).eq('id', idEditando);
      if (error) {
        actualizarEstadoRed(false);
        err.innerText = `Error: ${error.message}`;
      } else {
        actualizarEstadoRed(true);
        limpiarFormulario();
        await cargarPedidos();
      }
    } else {
      const { error } = await db.from('pedidos').insert([payload]);
      if (error) {
        colaOffline.push(payload);
        actualizarEstadoRed(false);
        err.innerText = `Sin conexión (${error.message}). Guardado en cola local.`;
      } else {
        actualizarEstadoRed(true);
        limpiarFormulario();
        await cargarPedidos();
      }
    }

    setTimeout(() => {
      btn.disabled = false;
    }, 350);
  }

  async function cancelarPedido(id) {
    const { error } = await db.from('pedidos').update({ estado: 'cancelado' }).eq('id', id);
    if (!error) {
      if (idEditando === id) limpiarFormulario();
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  setInterval(async () => {
    if (colaOffline.length === 0) return;
    const pendiente = colaOffline[0];
    const { error } = await db.from('pedidos').insert([pendiente]);
    if (!error) {
      colaOffline.shift();
      actualizarEstadoRed(true);
      await cargarPedidos();
    }
  }, 4000);

  async function cargarPedidos() {
    if (!sesionOp || cargando) return;
    cargando = true;
    try {
      const { data, error } = await db
        .from('pedidos')
        .select('*')
        .not('estado', 'in', '(completado,cancelado)')
        .order('creado_en', { ascending: true });

      if (!error && data) {
        pedidosActivos = data;
        renderizarTodo();
        actualizarEstadoRed(true);
      } else if (error) {
        actualizarEstadoRed(false);
      }
    } finally {
      cargando = false;
    }
  }

  function formatearDetallePedido(p) {
    const refFmt = (p.tipo_material && p.num_referencia) ? `${p.tipo_material}-${p.num_referencia}` : '';
    const partesPrincipales = [refFmt, p.opc ? `OPC ${p.opc}` : '', p.clase_material || ''].filter(Boolean);
    return partesPrincipales.length > 0 ? partesPrincipales.join(' · ') : (p.material || 'Material');
  }

  function renderizarTodo() {
    const lista = document.getElementById('lista-general');
    const resumen = document.getElementById('resumen-posicion');
    const numLinea = inputLinea.value.trim();
    const lineaActual = numLinea ? `Línea ${numLinea}` : '';

    document.getElementById('contador-general').innerText = `${pedidosActivos.length} activos`;

    if (!lineaActual) {
      resumen.innerHTML = 'Indica tu número de línea para ver tu posición.';
    } else {
      const indicesMios = [];
      pedidosActivos.forEach((p, idx) => {
        if (p.linea === lineaActual) indicesMios.push(idx);
      });

      if (indicesMios.length === 0) {
        resumen.innerHTML = `${lineaActual} sin pedidos activos ahora mismo.`;
      } else {
        const primeroIdx = indicesMios[0];
        resumen.innerHTML = primeroIdx === 0
          ? `${lineaActual} va <strong>1ª en la cola</strong> · Sin peticiones por delante.`
          : `${lineaActual} tiene <strong>${primeroIdx}</strong> por delante · Turno <strong>#${primeroIdx + 1}</strong>.`;
      }
    }

    if (pedidosActivos.length === 0) {
      lista.innerHTML = '<div style="color:var(--muted); font-weight:700;">No hay pedidos activos.</div>';
      return;
    }

    lista.innerHTML = pedidosActivos.map((p, idx) => {
      const esMio = lineaActual && p.linea === lineaActual;
      const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const detalle = formatearDetallePedido(p);
      const loteTxt = (p.lote && p.lote !== 'FIFO') ? `Lote ${p.lote}` : 'FIFO';
      const sub = [loteTxt, hora, p.solicitado_por || ''].filter(Boolean).join(' · ');
      const itemJson = encodeURIComponent(JSON.stringify(p));
      const estadoTxt = p.estado === 'en_camino' ? 'En camino' : 'Pendiente';

      return `
        <div class="pedido-card ${p.estado} ${esMio ? 'es-mio' : ''}">
          <div>
            <div class="pedido-main">#${idx + 1} · ${p.linea} — ${detalle}</div>
            <div class="pedido-sub">${sub}</div>
            <div>
              ${esMio ? '<span class="tag mio">Tu línea</span>' : ''}
              <span class="tag ${p.estado}">${estadoTxt}</span>
            </div>
          </div>
          ${esMio ? `
            <div class="acciones-card">
              <button type="button" class="btn-mini btn-mod" onclick="empezarEdicion(JSON.parse(decodeURIComponent('${itemJson}')))">Modificar</button>
              <button type="button" class="btn-mini btn-can" onclick="cancelarPedido(${p.id})">Cancelar</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  db.channel('cambios-pedidos-op-global')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
      cargarPedidos();
    })
    .subscribe();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sesionOp) {
      cargarPedidos();
    }
  });

  setInterval(cargarPedidos, 3000);
  if (sesionOp) {
    mostrarTrabajo();
  }
</script>
</body>
</html>
