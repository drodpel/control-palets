<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets - Operaria</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }
    .app-shell {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 10px;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 800;
    }
    .pill-status {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
    }
    .pill-status.offline {
      background: #d9770633;
      color: #fbbf24;
    }
    .user-badge {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      background: var(--card);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .btn-top {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Login compacto sin scroll */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .login-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    /* Grid principal en una sola pantalla */
    .main-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 12px;
      overflow: hidden;
    }
    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel-title {
      margin: 0 0 8px 0;
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field { margin-bottom: 8px; }
    label {
      display: block;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 1.08rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
    }
    input:focus, select:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    .mat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .mat-btn {
      padding: 12px 6px;
      font-size: 1.25rem;
      font-weight: 900;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      cursor: pointer;
    }
    .mat-btn.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: #fff;
    }

    .ref-row {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 8px;
      align-items: center;
    }
    .prefijo-box {
      padding: 10px 6px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 10px;
      background: var(--border);
      color: #fff;
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.9rem;
      font-weight: 800;
      min-height: 20px;
      margin: 4px 0 6px 0;
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      font-size: 1.12rem;
      font-weight: 900;
      border-radius: 11px;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-cancel-edit {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      font-size: 0.9rem;
      font-weight: 800;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    /* Resumen de posición y cola general */
    .resumen-turno {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .cola-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 2px;
    }
    .pedido-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 6px solid var(--warning);
      border-radius: 10px;
      padding: 9px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pedido-card.es-mio {
      background: #172554;
      border-color: #3b82f6;
      border-left-color: #60a5fa;
    }
    .pedido-card.en_camino {
      border-left-color: var(--success);
    }
    .pedido-main {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .pedido-sub {
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 4px;
    }
    .tag.pendiente { background: #d9770644; color: #fbbf24; }
    .tag.en_camino { background: #16a34a44; color: #4ade80; }
    .tag.mio { background: #2563eb66; color: #bfdbfe; }

    .acciones-card {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-mini {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.86rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .btn-mod { background: #475569; }
    .btn-can { background: var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-shell">
  <header>
    <div class="header-left">
      <h1>PALETS · OPERARIA</h1>
      <span id="network-status" class="pill-status">● Conectado</span>
      <span id="user-badge" class="user-badge hidden"></span>
    </div>
    <button id="btn-cambiar" class="btn-top hidden" onclick="salirTurno()">Cambiar nombre / línea</button>
  </header>

  <!-- ACCESO RÁPIDO SIN SCROLL -->
  <div id="vista-inicio" class="login-wrap">
    <div class="login-card">
      <h2 style="margin:0 0 12px 0; font-size:1.3rem;">¿Quién entra en este puesto?</h2>
      <div class="field">
        <label for="input-nombre">Tu nombre</label>
        <input type="text" id="input-nombre" placeholder="Escribe tu nombre" autocomplete="off">
      </div>
      <div class="field">
        <label for="select-linea-inicio">Tu línea hoy</label>
        <select id="select-linea-inicio">
          <option value="Línea 1">Línea 1</option>
          <option value="Línea 2">Línea 2</option>
          <option value="Línea 3">Línea 3</option>
          <option value="Línea 4">Línea 4</option>
          <option value="Línea 5">Línea 5</option>
          <option value="Línea 6">Línea 6</option>
          <option value="Línea 7">Línea 7</option>
          <option value="Línea 8">Línea 8</option>
          <option value="Línea 9">Línea 9</option>
          <option value="Línea 10">Línea 10</option>
        </select>
      </div>
      <div id="inicio-error" class="error-msg"></div>
      <button type="button" class="btn-submit" onclick="iniciarTurno()">ENTRAR</button>
    </div>
  </div>

  <!-- PANTALLA DE TRABAJO EN UNA SOLA PANTALLA -->
  <div id="vista-trabajo" class="main-grid hidden">
    <!-- IZQUIERDA: FORMULARIO VISUAL -->
    <section class="panel">
      <h2 id="titulo-form" class="panel-title">Nueva petición</h2>

      <div class="row-2">
        <div class="field">
          <label for="select-linea">Línea</label>
          <select id="select-linea">
            <option value="Línea 1">Línea 1</option>
            <option value="Línea 2">Línea 2</option>
            <option value="Línea 3">Línea 3</option>
            <option value="Línea 4">Línea 4</option>
            <option value="Línea 5">Línea 5</option>
            <option value="Línea 6">Línea 6</option>
            <option value="Línea 7">Línea 7</option>
            <option value="Línea 8">Línea 8</option>
            <option value="Línea 9">Línea 9</option>
            <option value="Línea 10">Línea 10</option>
          </select>
        </div>

        <div class="field">
          <label for="input-opc">OPC (4 dígitos, opcional)</label>
          <input type="text" id="input-opc" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="Ej. 4821">
        </div>
      </div>

      <div class="field">
        <label>Material (si no hay OPC, obligatorio)</label>
        <div class="mat-row">
          <button type="button" class="mat-btn" data-mat="ST" onclick="seleccionarMaterial('ST')">ST</button>
          <button type="button" class="mat-btn" data-mat="MP" onclick="seleccionarMaterial('MP')">MP</button>
          <button type="button" class="mat-btn" data-mat="PT" onclick="seleccionarMaterial('PT')">PT</button>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="input-num-ref">Nº Referencia</label>
          <div class="ref-row">
            <div id="prefijo-visible" class="prefijo-box">--</div>
            <input type="text" id="input-num-ref" inputmode="numeric" pattern="[0-9]*" placeholder="Nº">
          </div>
        </div>

        <div class="field">
          <label for="input-lote">Lote (vacío = FIFO)</label>
          <input type="text" id="input-lote" placeholder="FIFO">
        </div>
      </div>

      <div id="form-error" class="error-msg"></div>
      <button type="button" class="btn-submit" id="btn-guardar" onclick="guardarPedido()">SOLICITAR MATERIAL</button>
      <button type="button" id="btn-cancelar-edicion" class="btn-cancel-edit hidden" onclick="cancelarEdicion()">Cancelar edición</button>
    </section>

    <!-- DERECHA: COLA GENERAL ACTIVA -->
    <section class="panel">
      <div class="panel-title">
        <span>Pedidos activos (Toda la cola)</span>
        <span id="contador-general" style="font-size:0.92rem; color:#93c5fd;">0 activos</span>
      </div>

      <div id="resumen-posicion" class="resumen-turno">Sin pedidos activos de tu línea.</div>

      <div id="lista-general" class="cola-scroll"></div>
    </section>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  localStorage.removeItem('colaOfflineOperaria');

  let sesionOp = JSON.parse(sessionStorage.getItem('sesionOperariaActual') || 'null');
  let tipoMaterialSeleccionado = '';
  let idEditando = null;
  let pedidosActivos = [];
  let colaOffline = [];
  let cargando = false;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function iniciarTurno() {
    const nombre = document.getElementById('input-nombre').value.trim();
    const linea = document.getElementById('select-linea-inicio').value;
    const err = document.getElementById('inicio-error');

    if (!nombre) {
      err.innerText = 'Escribe tu nombre para entrar.';
      return;
    }
    err.innerText = '';
    sesionOp = { nombre, linea };
    sessionStorage.setItem('sesionOperariaActual', JSON.stringify(sesionOp));
    document.getElementById('select-linea').value = linea;
    mostrarTrabajo();
  }

  function salirTurno() {
    sessionStorage.removeItem('sesionOperariaActual');
    sesionOp = null;
    cancelarEdicion();
    document.getElementById('vista-trabajo').classList.add('hidden');
    document.getElementById('vista-inicio').classList.remove('hidden');
    document.getElementById('user-badge').classList.add('hidden');
    document.getElementById('btn-cambiar').classList.add('hidden');
  }

  function mostrarTrabajo() {
    if (!sesionOp) return;
    document.getElementById('vista-inicio').classList.add('hidden');
    document.getElementById('vista-trabajo').classList.remove('hidden');
    const badge = document.getElementById('user-badge');
    badge.classList.remove('hidden');
    badge.innerText = `${sesionOp.nombre} · ${sesionOp.linea}`;
    document.getElementById('btn-cambiar').classList.remove('hidden');
    cargarPedidos();
  }

  document.getElementById('select-linea').addEventListener('change', (e) => {
    if (sesionOp) {
      sesionOp.linea = e.target.value;
      sessionStorage.setItem('sesionOperariaActual', JSON.stringify(sesionOp));
      document.getElementById('user-badge').innerText = `${sesionOp.nombre} · ${sesionOp.linea}`;
      renderizarTodo();
    }
  });

  function seleccionarMaterial(tipo) {
    tipoMaterialSeleccionado = tipo;
    document.querySelectorAll('.mat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mat === tipo);
    });
    document.getElementById('prefijo-visible').innerText = tipo;
    const numInput = document.getElementById('input-num-ref');
    numInput.focus();
    numInput.click();
  }

  document.getElementById('input-opc').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  document.getElementById('input-num-ref').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
  });

  function actualizarEstadoRed(online) {
    const badge = document.getElementById('network-status');
    badge.innerText = online ? '● Conectado' : '● Sin cobertura';
    badge.className = online ? 'pill-status' : 'pill-status offline';
  }

  function limpiarFormulario() {
    idEditando = null;
    document.getElementById('titulo-form').innerText = 'Nueva petición';
    document.getElementById('btn-guardar').innerText = 'SOLICITAR MATERIAL';
    document.getElementById('btn-cancelar-edicion').classList.add('hidden');
    document.getElementById('input-opc').value = '';
    document.getElementById('input-num-ref').value = '';
    document.getElementById('input-lote').value = '';
    tipoMaterialSeleccionado = '';
    document.getElementById('prefijo-visible').innerText = '--';
    document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('form-error').innerText = '';
  }

  function cancelarEdicion() {
    limpiarFormulario();
  }

  function empezarEdicion(pedido) {
    idEditando = pedido.id;
    document.getElementById('titulo-form').innerText = `Modificando #${pedido.id} (vuelve a cola)`;
    document.getElementById('btn-guardar').innerText = 'GUARDAR Y VOLVER A COLA';
    document.getElementById('btn-cancelar-edicion').classList.remove('hidden');

    document.getElementById('select-linea').value = pedido.linea || sesionOp.linea;
    document.getElementById('input-opc').value = pedido.opc || '';
    document.getElementById('input-num-ref').value = pedido.num_referencia || '';
    document.getElementById('input-lote').value = (pedido.lote && pedido.lote !== 'FIFO') ? pedido.lote : '';

    tipoMaterialSeleccionado = pedido.tipo_material || '';
    document.getElementById('prefijo-visible').innerText = tipoMaterialSeleccionado || '--';
    document.querySelectorAll('.mat-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mat === tipoMaterialSeleccionado);
    });
  }

  function claveMaterial(item) {
    const tipo = (item.tipo_material || '').toUpperCase();
    const num = (item.num_referencia || '').trim();
    const opc = (item.opc || '').trim();
    const lote = (item.lote || 'FIFO').trim().toUpperCase();
    return `${tipo}|${num}|${opc}|${lote}`;
  }

  function existeMaterialDuplicado(linea, candidato, excluirId = null) {
    const claveNueva = claveMaterial(candidato);
    const activosEnLinea = pedidosActivos.filter(p => p.linea === linea && p.id !== excluirId);
    const enColaLocal = colaOffline.filter(p => p.linea === linea);
    return [...activosEnLinea, ...enColaLocal].some(p => claveMaterial(p) === claveNueva);
  }

  async function guardarPedido() {
    const err = document.getElementById('form-error');
    const linea = document.getElementById('select-linea').value;
    const opc = document.getElementById('input-opc').value.trim();
    const numRef = document.getElementById('input-num-ref').value.trim();
    const loteInput = document.getElementById('input-lote').value.trim();

    if (opc && opc.length !== 4) {
      err.innerText = 'La OPC debe tener 4 dígitos o dejarse vacía.';
      return;
    }
    if (!opc && (!tipoMaterialSeleccionado || !numRef)) {
      err.innerText = 'Sin OPC marca ST, MP o PT y escribe su número.';
      return;
    }
    if (tipoMaterialSeleccionado && !numRef) {
      err.innerText = `Escribe el número de ${tipoMaterialSeleccionado}.`;
      document.getElementById('input-num-ref').focus();
      return;
    }

    const referenciaCompleta = tipoMaterialSeleccionado && numRef
      ? `${tipoMaterialSeleccionado}-${numRef}`
      : 'Según OPC';

    const payload = {
      linea,
      material: `${referenciaCompleta} (${loteInput ? 'Lote ' + loteInput : 'FIFO'})`,
      solicitado_por: sesionOp ? sesionOp.nombre : 'Operaria',
      opc: opc || null,
      tipo_material: tipoMaterialSeleccionado || null,
      num_referencia: numRef || null,
      lote: loteInput || 'FIFO',
      estado: 'pendiente',
      creado_en: new Date().toISOString()
    };

    if (existeMaterialDuplicado(linea, payload, idEditando)) {
      err.innerText = 'Ya hay ese mismo material pedido en esta línea.';
      return;
    }

    err.innerText = '';
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;

    if (idEditando) {
      const { error } = await db.from('pedidos').update(payload).eq('id', idEditando);
      if (error) {
        actualizarEstadoRed(false);
        err.innerText = `Error: ${error.message}`;
      } else {
        actualizarEstadoRed(true);
        limpiarFormulario();
        await cargarPedidos();
      }
    } else {
      const { error } = await db.from('pedidos').insert([payload]);
      if (error) {
        colaOffline.push(payload);
        actualizarEstadoRed(false);
        err.innerText = `Sin conexión (${error.message}). Guardado en cola local.`;
      } else {
        actualizarEstadoRed(true);
        limpiarFormulario();
        await cargarPedidos();
      }
    }

    setTimeout(() => {
      btn.disabled = false;
    }, 350);
  }

  async function cancelarPedido(id) {
    const { error } = await db.from('pedidos').update({ estado: 'cancelado' }).eq('id', id);
    if (!error) {
      if (idEditando === id) limpiarFormulario();
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  setInterval(async () => {
    if (colaOffline.length === 0) return;
    const pendiente = colaOffline[0];
    const { error } = await db.from('pedidos').insert([pendiente]);
    if (!error) {
      colaOffline.shift();
      actualizarEstadoRed(true);
      await cargarPedidos();
    }
  }, 4000);

  async function cargarPedidos() {
    if (!sesionOp || cargando) return;
    cargando = true;
    try {
      const { data, error } = await db
        .from('pedidos')
        .select('*')
        .not('estado', 'in', '(completado,cancelado)')
        .order('creado_en', { ascending: true });

      if (!error && data) {
        pedidosActivos = data;
        renderizarTodo();
        actualizarEstadoRed(true);
      } else if (error) {
        actualizarEstadoRed(false);
      }
    } finally {
      cargando = false;
    }
  }

  function formatearRef(p) {
    return p.tipo_material && p.num_referencia
      ? `${p.tipo_material}-${p.num_referencia}`
      : (p.material || 'Material');
  }

  function renderizarTodo() {
    const lista = document.getElementById('lista-general');
    const resumen = document.getElementById('resumen-posicion');
    const lineaActual = document.getElementById('select-linea').value;

    document.getElementById('contador-general').innerText = `${pedidosActivos.length} activos`;

    const indicesMios = [];
    pedidosActivos.forEach((p, idx) => {
      if (p.linea === lineaActual) indicesMios.push(idx);
    });

    if (indicesMios.length === 0) {
      resumen.innerHTML = `Tu línea (${lineaActual}) no tiene pedidos activos ahora mismo.`;
    } else {
      const primeroIdx = indicesMios[0];
      const porDelante = primeroIdx;
      resumen.innerHTML = porDelante === 0
        ? `¡Tu línea (${lineaActual}) va <strong>1ª en la cola</strong>! Sin peticiones por delante.`
        : `Tu línea (${lineaActual}) tiene <strong>${porDelante}</strong> petición(es) por delante · Tu 1º pedido es el <strong>#${primeroIdx + 1}</strong>.`;
    }

    if (pedidosActivos.length === 0) {
      lista.innerHTML = '<div style="color:var(--muted); font-weight:700;">No hay pedidos activos en este momento.</div>';
      return;
    }

    lista.innerHTML = pedidosActivos.map((p, idx) => {
      const esMio = p.linea === lineaActual;
      const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const refFmt = formatearRef(p);
      const extras = [
        p.opc ? `OPC ${p.opc}` : null,
        `Lote ${p.lote || 'FIFO'}`,
        hora,
        p.solicitado_por || ''
      ].filter(Boolean).join(' · ');

      const itemJson = encodeURIComponent(JSON.stringify(p));
      const estadoTxt = p.estado === 'en_camino' ? 'En camino' : 'Pendiente';

      return `
        <div class="pedido-card ${p.estado} ${esMio ? 'es-mio' : ''}">
          <div>
            <div class="pedido-main">
              #${idx + 1} · ${p.linea} — ${refFmt}
            </div>
            <div class="pedido-sub">${extras}</div>
            <div style="margin-top:4px;">
              ${esMio ? '<span class="tag mio">Tu línea</span>' : ''}
              <span class="tag ${p.estado}">${estadoTxt}</span>
            </div>
          </div>
          ${esMio ? `
            <div class="acciones-card">
              <button type="button" class="btn-mini btn-mod" onclick="empezarEdicion(JSON.parse(decodeURIComponent('${itemJson}')))">Modificar</button>
              <button type="button" class="btn-mini btn-can" onclick="cancelarPedido(${p.id})">Cancelar</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  db.channel('cambios-pedidos-op-global')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
      cargarPedidos();
    })
    .subscribe();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sesionOp) {
      cargarPedidos();
    }
  });

  setInterval(cargarPedidos, 3000);
  if (sesionOp) {
    document.getElementById('select-linea').value = sesionOp.linea;
    mostrarTrabajo();
  }
</script>
</body>
</html>
