<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #ffffff;
      --label: #ffffff;
      --muted: #e2e8f0;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }
    .app-shell {
      height: 100dvh;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    @media (orientation: landscape) and (max-height: 540px) {
      html, body {
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
      }
      .app-shell {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
      }
      .main-grid {
        overflow: visible !important;
      }
      .panel {
        overflow: visible !important;
      }
      .cola-scroll {
        max-height: 260px;
      }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-status {
      font-size: 0.86rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
    }
    .pill-status.offline {
      background: #d9770633;
      color: #fbbf24;
    }
    .user-badge {
      font-size: 1rem;
      font-weight: 900;
      color: #ffffff;
      background: var(--card);
      padding: 4px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
    }
    .btn-top {
      background: #334155;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .login-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .main-grid {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 10px;
      overflow: hidden;
    }
    @media (max-width: 760px) and (orientation: portrait) {
      .main-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .form-spread {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 8px;
      overflow-y: auto;
    }

    .panel-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .panel-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .btn-filtro {
      background: #334155;
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-filtro.activo-listos {
      background: var(--success);
      border-color: #4ade80;
      color: #ffffff;
    }
    .btn-filtro.activo-mios {
      background: var(--primary);
      border-color: #93c5fd;
      color: #ffffff;
    }

    .row-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    label {
      font-size: clamp(1rem, 1.45vw, 1.32rem);
      font-weight: 900;
      color: var(--label);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    input, select {
      width: 100%;
      min-width: 0;
      height: clamp(38px, 5.6dvh, 58px);
      padding: 6px 10px;
      font-size: clamp(1.05rem, 1.55vw, 1.38rem);
      font-weight: 800;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
    }
    input::placeholder { color: #94a3b8; font-weight: 700; font-size: 0.88em; }
    input:focus, select:focus {
      outline: 2px solid #60a5fa;
      border-color: #60a5fa;
    }

    .ref-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .st-mp-pt-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }
    .mat-pill {
      padding: clamp(4px, 0.75dvh, 9px) 4px;
      font-size: clamp(0.88rem, 1.2vw, 1.1rem);
      font-weight: 900;
      line-height: 1.1;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      min-width: 0;
    }
    .mat-pill.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: #ffffff;
    }

    .num-locked-box {
      width: 100%;
      min-width: 0;
      height: clamp(38px, 5.6dvh, 58px);
      display: flex;
      align-items: center;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      overflow: hidden;
    }
    .num-locked-box:focus-within {
      outline: 2px solid #60a5fa;
      border-color: #60a5fa;
    }
    .prefijo-fijo {
      padding: 0 0 0 10px;
      font-size: clamp(1.05rem, 1.55vw, 1.38rem);
      font-weight: 900;
      color: #93c5fd;
      user-select: none;
      flex-shrink: 0;
    }
    .num-locked-box input {
      border: none;
      background: transparent;
      height: 100%;
      padding: 6px 10px 6px 4px;
      outline: none !important;
      flex: 1;
      min-width: 0;
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.96rem;
      font-weight: 900;
      min-height: 18px;
      flex-shrink: 0;
    }
    .btn-submit {
      width: 100%;
      padding: clamp(10px, 1.8dvh, 18px);
      font-size: clamp(1.1rem, 1.7vw, 1.45rem);
      font-weight: 900;
      border-radius: 11px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-cancel-edit {
      width: 100%;
      padding: 7px;
      font-size: 0.92rem;
      font-weight: 900;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .cola-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }
    .pedido-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 6px solid var(--warning);
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pedido-card.es-mio {
      background: #172554;
      border-color: #60a5fa;
      border-left-color: #93c5fd;
    }
    .pedido-card.completado {
      border-left-color: var(--success);
    }
    .pedido-main {
      font-size: 1.02rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }
    .pedido-sub {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }
    .tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 900;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      margin-right: 4px;
      margin-top: 3px;
    }
    .tag.pendiente { background: #d9770644; color: #fbbf24; }
    .tag.completado { background: #16a34a55; color: #4ade80; }
    .tag.mio { background: #2563eb88; color: #ffffff; }
    .tag.tiempo { background: #7c3aed66; color: #ddd6fe; }

    .acciones-card {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-mini {
      border: none;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 0.86rem;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
    }
    .btn-mod { background: #475569; }
    .btn-can { background: var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-shell">
  <header>
    <div class="header-left">
      <span id="network-status" class="pill-status">● Conectado</span>
      <span id="user-badge" class="user-badge hidden"></span>
    </div>
    <button id="btn-cambiar" class="btn-top hidden" onclick="salirTurno()">Cambiar nombre</button>
  </header>

  <div id="vista-inicio" class="login-wrap">
    <div class="login-card">
      <div class="field" style="margin-bottom:12px;">
        <label for="input-nombre">Nombre</label>
        <input type="text" id="input-nombre" autocomplete="off">
      </div>
      <div id="inicio-error" class="error-msg"></div>
      <button type="button" class="btn-submit" onclick="iniciarTurno()">ENTRAR</button>
    </div>
  </div>

  <div id="vista-trabajo" class="main-grid hidden">
    <section class="panel">
      <div class="form-spread">
        <div class="row-2">
          <div class="field">
            <label for="input-opc">OPC</label>
            <input type="text" id="input-opc" inputmode="numeric" pattern="\d{4}" maxlength="4" enterkeyhint="done" placeholder="4 últimos dígitos">
          </div>

          <div class="field">
            <label for="input-linea">Línea</label>
            <input type="text" id="input-linea" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done">
          </div>
        </div>

        <div id="bloque-tipo-material" class="row-2 hidden">
          <div class="field">
            <label for="select-clase-mat">Material</label>
            <select id="select-clase-mat" onchange="alCambiarClaseMaterial()">
              <option value=""></option>
              <option value="lámina">lámina</option>
              <option value="interior">interior</option>
              <option value="posicionador">posicionador</option>
              <option value="sin estuchar">sin estuchar</option>
              <option value="sin encelofanar">sin encelofanar</option>
              <option value="estuche">estuche</option>
              <option value="embalaje">embalaje</option>
              <option value="embalaje inner">embalaje inner</option>
              <option value="otro">otro</option>
            </select>
          </div>

          <div id="campo-otro-mat" class="field hidden">
            <label for="input-otro-mat">Material</label>
            <input type="text" id="input-otro-mat" enterkeyhint="done">
          </div>
        </div>

        <div class="row-2">
          <div class="ref-col">
            <div class="st-mp-pt-row">
              <button type="button" class="mat-pill" data-mat="ST" onclick="seleccionarPrefijo('ST')">ST</button>
              <button type="button" class="mat-pill" data-mat="MP" onclick="seleccionarPrefijo('MP')">MP</button>
              <button type="button" class="mat-pill" data-mat="PT" onclick="seleccionarPrefijo('PT')">PT</button>
            </div>
            <div class="num-locked-box">
              <span id="prefijo-fijo-span" class="prefijo-fijo hidden"></span>
              <input type="text" id="input-num-ref" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done">
            </div>
          </div>

          <div class="field">
            <label for="input-lote">Lote</label>
            <input type="text" id="input-lote" enterkeyhint="done">
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="select-tiempo">Lo necesito en...</label>
            <select id="select-tiempo" onchange="alCambiarTiempo()">
              <option value=""></option>
              <option value="15 min">15 min</option>
              <option value="30 min">30 min</option>
              <option value="1 hora">1 hora</option>
              <option value="2 horas">2 horas</option>
              <option value="+ de 2 horas">+ de 2 horas</option>
            </select>
          </div>

          <div id="campo-cantidad" class="field hidden">
            <label for="input-cantidad">Cantidad</label>
            <input type="number" id="input-cantidad" min="1" step="1" value="1" inputmode="numeric" enterkeyhint="done">
          </div>
        </div>
      </div>

      <div id="form-error" class="error-msg"></div>
      <button type="button" class="btn-submit" id="btn-guardar" onclick="guardarPedido()">SOLICITAR</button>
      <button type="button" id="btn-cancelar-edicion" class="btn-cancel-edit hidden" onclick="cancelarEdicion()">Cancelar edición</button>
    </section>

    <section class="panel">
      <div class="panel-title">
        <div class="panel-title-left">
          <span>Pedidos</span>
          <button type="button" id="btn-todos-listos" class="btn-filtro" onclick="alternarTodosListos()">Todos listos</button>
          <button type="button" id="btn-todos-mios" class="btn-filtro" onclick="alternarTodosMios()">Todos míos</button>
        </div>
        <span id="contador-mios-hoy" style="font-size:0.96rem; color:#93c5fd;">Hoy: 0</span>
      </div>

      <div id="lista-general" class="cola-scroll"></div>
    </section>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  localStorage.removeItem('colaOfflineOperaria');

  let sesionOp = JSON.parse(
    localStorage.getItem('sesionOperariaNombre') ||
    sessionStorage.getItem('sesionOperariaNombre') ||
    'null'
  );
  if (sesionOp && sesionOp.nombre) {
    localStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
  } else {
    sesionOp = null;
  }

  let prefijoSeleccionado = '';
  let idEditando = null;
  let pedidosHoyTodos = [];
  let peticionesHoyNombre = [];
  let mostrarTodosCompletados = false;
  let mostrarSoloMios = false;
  let idsListosAvisados = new Set();
  let primeraCargaOp = true;
  let colaOffline = [];
  let cargando = false;
  let audioCtxOp = null;
  let estaOnlineOp = navigator.onLine;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function inicioHoyISO() {
    const ahora = new Date();
    const inicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), 0, 0, 0, 0);
    return inicio.toISOString();
  }

  function calcularVencimientoMs(opcionTiempo) {
    const minutosMap = {
      '15 min': 15,
      '30 min': 30,
      '1 hora': 60,
      '2 horas': 120,
      '+ de 2 horas': 121
    };
    const mins = minutosMap[opcionTiempo];
    if (!mins) return null;
    return Date.now() + mins * 60000;
  }

  function codificarMetaEnMaterial(resumenBase, tiempoSel, cantidadNum) {
    const venceMs = tiempoSel ? calcularVencimientoMs(tiempoSel) : null;
    const cant = Math.max(1, parseInt(cantidadNum, 10) || 1);
    const meta = {
      t: tiempoSel || null,
      v: venceMs || null,
      c: cant
    };
    return `${resumenBase} [[META:${btoa(unescape(encodeURIComponent(JSON.stringify(meta))))}]]`;
  }

  function decodificarPedidoConMeta(p) {
    const rawMat = String(p?.material || '');
    const match = rawMat.match(/\[\[META:([^\]]+)\]\]$/);
    let meta = { t: null, v: null, c: 1 };
    let materialLimpio = rawMat;
    if (match) {
      materialLimpio = rawMat.replace(/\[\[META:[^\]]+\]\]$/, '').trim();
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(match[1]))));
        meta = {
          t: parsed.t || null,
          v: parsed.v ? Number(parsed.v) : null,
          c: Math.max(1, parseInt(parsed.c, 10) || 1)
        };
      } catch (_) {}
    }
    return {
      ...p,
      material_limpio: materialLimpio,
      tiempo_aviso: p.tiempo_aviso || meta.t,
      vence_en: p.vence_en || (meta.v ? new Date(meta.v).toISOString() : null),
      vence_ms: p.vence_en ? new Date(p.vence_en).getTime() : meta.v,
      cantidad: Math.max(1, parseInt(p.cantidad || meta.c || 1, 10) || 1)
    };
  }

  function esPedidoConTiempo(p) {
    return Boolean(p && (p.tiempo_aviso || p.vence_ms));
  }

  function haVencidoTiempoPedido(p) {
    if (!esPedidoConTiempo(p)) return true;
    const ms = p.vence_ms || (p.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return true;
    return Date.now() >= ms;
  }

  function formatearHoraVencimiento(p) {
    const ms = p?.vence_ms || (p?.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return '';
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function actualizarVisualBotonesFiltro() {
    const btnListos = document.getElementById('btn-todos-listos');
    const btnMios = document.getElementById('btn-todos-mios');
    if (btnListos) btnListos.classList.toggle('activo-listos', mostrarTodosCompletados);
    if (btnMios) btnMios.classList.toggle('activo-mios', mostrarSoloMios);
  }

  function limpiarFiltrosPedidos() {
    mostrarTodosCompletados = false;
    mostrarSoloMios = false;
    actualizarVisualBotonesFiltro();
  }

  function alternarTodosListos() {
    mostrarTodosCompletados = !mostrarTodosCompletados;
    actualizarVisualBotonesFiltro();
    renderizarTodo();
  }

  function alternarTodosMios() {
    mostrarSoloMios = !mostrarSoloMios;
    actualizarVisualBotonesFiltro();
    renderizarTodo();
  }

  function hacerScrollArribaPedidosSiProcede() {
    requestAnimationFrame(() => {
      const lista = document.getElementById('lista-general');
      if (lista && lista.scrollTop > 0) {
        lista.scrollTop = 0;
      }
    });
  }

  function sonarPitidoFuerteOp() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioCtxOp) {
        audioCtxOp = new AudioCtx();
      }
      if (audioCtxOp.state === 'suspended') {
        audioCtxOp.resume().catch(() => {});
      }
      const ahora = audioCtxOp.currentTime;
      const tonos = [
        [987, ahora, 0.2],
        [1318, ahora + 0.22, 0.25]
      ];
      tonos.forEach(([freq, start, dur]) => {
        const osc = audioCtxOp.createOscillator();
        const gain = audioCtxOp.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.45, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtxOp.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      });
    } catch (_) {}
  }

  function solicitarPermisoNotificacionEnSegundoPlano() {
    try {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }
    } catch (_) {}
  }

  function notificarPedidoListo(titulo, cuerpo) {
    sonarPitidoFuerteOp();
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(titulo, {
              body: cuerpo,
              tag: 'pedido-listo-op',
              renotify: true
            });
          }).catch(() => {
            new Notification(titulo, { body: cuerpo });
          });
        } else {
          new Notification(titulo, { body: cuerpo });
        }
      }
    } catch (_) {}
  }

  function iniciarTurno() {
    const inputEl = document.getElementById('input-nombre');
    const nombre = (inputEl ? inputEl.value : '').trim();
    const err = document.getElementById('inicio-error');
    if (!nombre) {
      if (err) err.innerText = 'Escribe tu nombre.';
      return;
    }
    if (err) err.innerText = '';
    sesionOp = { nombre: nombre };
    try {
      localStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
      sessionStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
    } catch (_) {}

    mostrarTrabajo();
    sonarPitidoFuerteOp();
    solicitarPermisoNotificacionEnSegundoPlano();
  }

  function salirTurno() {
    try {
      localStorage.removeItem('sesionOperariaNombre');
      sessionStorage.removeItem('sesionOperariaNombre');
    } catch (_) {}
    sesionOp = null;
    primeraCargaOp = true;
    idsListosAvisados.clear();
    cancelarEdicion();
    document.getElementById('vista-trabajo').classList.add('hidden');
    document.getElementById('vista-inicio').classList.remove('hidden');
    document.getElementById('user-badge').classList.add('hidden');
    document.getElementById('btn-cambiar').classList.add('hidden');
  }

  function mostrarTrabajo() {
    if (!sesionOp) return;
    document.getElementById('vista-inicio').classList.add('hidden');
    document.getElementById('vista-trabajo').classList.remove('hidden');
    const badge = document.getElementById('user-badge');
    badge.classList.remove('hidden');
    badge.innerText = sesionOp.nombre;
    document.getElementById('btn-cambiar').classList.remove('hidden');
    cargarPedidos();
  }

  function cerrarTecladoAlAceptar(inputEl) {
    if (!inputEl) return;
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        inputEl.blur();
      }
    });
  }

  const inputNombreInicio = document.getElementById('input-nombre');
  if (inputNombreInicio) {
    inputNombreInicio.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        iniciarTurno();
      }
    });
  }

  const inputOpc = document.getElementById('input-opc');
  const inputLinea = document.getElementById('input-linea');
  const inputNumRef = document.getElementById('input-num-ref');
  const inputOtroMat = document.getElementById('input-otro-mat');
  const inputLote = document.getElementById('input-lote');
  const selectTiempo = document.getElementById('select-tiempo');
  const inputCantidad = document.getElementById('input-cantidad');
  const prefijoSpan = document.getElementById('prefijo-fijo-span');

  [inputOpc, inputLinea, inputNumRef, inputOtroMat, inputLote, inputCantidad].forEach(cerrarTecladoAlAceptar);

  inputLinea.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
  });
  inputOpc.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    actualizarVisibilidadClaseMaterial();
  });
  inputNumRef.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
    actualizarVisibilidadClaseMaterial();
  });

  function alCambiarTiempo() {
    const valTiempo = selectTiempo.value;
    const campoCant = document.getElementById('campo-cantidad');
    const tieneTiempo = Boolean(valTiempo);
    campoCant.classList.toggle('hidden', !tieneTiempo);
    if (tieneTiempo && (!inputCantidad.value || Number(inputCantidad.value) < 1)) {
      inputCantidad.value = '1';
    }
  }

  function tieneReferenciaCompleta() {
    return Boolean(prefijoSeleccionado && inputNumRef.value.trim());
  }

  function actualizarPrefijoVisual() {
    if (prefijoSeleccionado) {
      prefijoSpan.textContent = `${prefijoSeleccionado}-`;
      prefijoSpan.classList.remove('hidden');
    } else {
      prefijoSpan.textContent = '';
      prefijoSpan.classList.add('hidden');
    }
  }

  function seleccionarPrefijo(pref) {
    prefijoSeleccionado = (prefijoSeleccionado === pref) ? '' : pref;
    document.querySelectorAll('.mat-pill').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mat === prefijoSeleccionado);
    });
    actualizarPrefijoVisual();
    actualizarVisibilidadClaseMaterial();
    inputNumRef.focus();
  }

  function actualizarVisibilidadClaseMaterial() {
    const tieneOpc = Boolean(inputOpc.value.trim());
    const pedirMaterial = tieneOpc && !tieneReferenciaCompleta();
    document.getElementById('bloque-tipo-material').classList.toggle('hidden', !pedirMaterial);
    if (!pedirMaterial) {
      document.getElementById('select-clase-mat').value = '';
      inputOtroMat.value = '';
      document.getElementById('campo-otro-mat').classList.add('hidden');
    }
  }
