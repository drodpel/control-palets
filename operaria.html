<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Control de Palets</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --warning: #d97706;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #ffffff;
      --label: #ffffff;
      --muted: #e2e8f0;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }
    .app-shell {
      min-height: 100dvh;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 6px 10px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: nowrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }
    .pill-status {
      font-size: 0.82rem;
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 999px;
      background: #16a34a33;
      color: #4ade80;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-status.offline {
      background: #d9770633;
      color: #fbbf24;
    }
    .user-badge {
      font-size: 0.94rem;
      font-weight: 900;
      color: #ffffff;
      background: var(--card);
      padding: 3px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-top {
      background: #334155;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .login-wrap {
      flex: 1;
      min-height: 60dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    /* Izquierda: Pedidos (Mis pedidos + Cola) | Derecha: Datos + Teclado numérico al lado */
    .main-grid {
      flex: 1;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.35fr);
      gap: 10px;
      align-items: start;
    }
    @media (max-width: 820px) and (orientation: portrait) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 11px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px;
      min-width: 0;
    }

    /* Dos bloques dentro de Pedidos: Mis pedidos y Cola de pedidos */
    .pedidos-split {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sub-bloque {
      background: #141d2e;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .sub-titulo {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 900;
      color: #93c5fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Dentro del panel derecho: un campo por fila a la izquierda y teclado numérico al lado */
    .entrada-y-teclado {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(190px, 0.85fr);
      gap: 10px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .entrada-y-teclado {
        grid-template-columns: 1fr;
      }
    }

    .campos-verticales {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      overflow-anchor: none;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    label {
      font-size: clamp(0.88rem, 1.15vw, 1.05rem);
      font-weight: 900;
      color: var(--label);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    input, select {
      width: 100%;
      min-width: 0;
      height: clamp(34px, 4.4vh, 42px);
      padding: 3px 9px;
      font-size: clamp(0.96rem, 1.3vw, 1.15rem);
      font-weight: 800;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
    }
    input::placeholder { color: #94a3b8; font-weight: 700; font-size: 0.84em; }
    input:focus, select:focus {
      outline: 2px solid #60a5fa;
      border-color: #60a5fa;
    }
    input.keypad-target-active {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px #60a5fa55;
      background: #0f1c33;
    }

    .st-mp-pt-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      width: 100%;
      margin-bottom: 3px;
    }
    .mat-pill {
      padding: 4px 4px;
      font-size: clamp(0.82rem, 1vw, 0.94rem);
      font-weight: 900;
      line-height: 1.1;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      min-width: 0;
    }
    .mat-pill.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: #ffffff;
    }

    .num-locked-box {
      width: 100%;
      min-width: 0;
      height: clamp(34px, 4.4vh, 42px);
      display: flex;
      align-items: center;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-2);
      overflow: hidden;
    }
    .num-locked-box.keypad-box-active,
    .num-locked-box:focus-within {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px #60a5fa55;
      background: #0f1c33;
    }
    .prefijo-fijo {
      padding: 0 0 0 9px;
      font-size: clamp(0.96rem, 1.3vw, 1.15rem);
      font-weight: 900;
      color: #93c5fd;
      user-select: none;
      flex-shrink: 0;
    }
    .num-locked-box input {
      border: none;
      background: transparent !important;
      box-shadow: none !important;
      height: 100%;
      padding: 3px 9px 3px 4px;
      outline: none !important;
      flex: 1;
      min-width: 0;
    }

    /* Teclado numérico fijo al lado (3x4 clásico) */
    .fixed-numpad {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      user-select: none;
      touch-action: manipulation;
    }
    .numpad-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.76rem;
      font-weight: 800;
      color: #93c5fd;
      padding: 0 2px;
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }
    .num-key {
      height: clamp(36px, 5vh, 46px);
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: #1e293b;
      color: #ffffff;
      font-size: clamp(1.05rem, 1.5vw, 1.28rem);
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      touch-action: manipulation;
    }
    .num-key:active {
      background: var(--primary);
      border-color: #93c5fd;
      transform: scale(0.97);
    }
    .num-key.key-del {
      background: #334155;
      color: #fbbf24;
    }
    .num-key.key-clear {
      background: #3f1d24;
      border-color: #7f1d1d;
      color: #fca5a5;
      font-size: 0.98rem;
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.88rem;
      font-weight: 900;
      min-height: 14px;
      flex-shrink: 0;
    }
    .btn-submit {
      width: 100%;
      padding: clamp(9px, 1.3vh, 14px);
      font-size: clamp(1rem, 1.45vw, 1.25rem);
      font-weight: 900;
      border-radius: 9px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-cancel-edit {
      width: 100%;
      padding: 6px;
      font-size: 0.86rem;
      font-weight: 900;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .cola-scroll {
      max-height: 34dvh;
      overflow-y: auto;
      overflow-anchor: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }
    .pedido-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-left: 6px solid var(--warning);
      border-radius: 8px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pedido-card.es-mio {
      background: #172554;
      border-color: #60a5fa;
      border-left-color: #93c5fd;
    }
    .pedido-card.completado {
      border-left-color: var(--success);
    }
    .pedido-main {
      font-size: 0.96rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }
    .pedido-sub {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }
    .pedido-progreso {
      font-size: 0.82rem;
      font-weight: 900;
      color: #93c5fd;
      margin-top: 2px;
    }
    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
      margin-right: 4px;
      margin-top: 3px;
    }
    .tag.pendiente { background: #d9770644; color: #fbbf24; }
    .tag.completado { background: #16a34a55; color: #4ade80; }
    .tag.mio { background: #2563eb88; color: #ffffff; }
    .tag.tiempo { background: #7c3aed66; color: #ddd6fe; }

    .acciones-card {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-mini {
      border: none;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
    }
    .btn-mod { background: #475569; }
    .btn-can { background: var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-shell">
  <header>
    <div class="header-left">
      <span id="network-status" class="pill-status">● Conectado</span>
      <span id="user-badge" class="user-badge hidden"></span>
    </div>
    <button id="btn-cambiar" class="btn-top hidden" onclick="salirTurno()">Cambiar nombre</button>
  </header>

  <div id="vista-inicio" class="login-wrap">
    <div class="login-card">
      <div class="field" style="margin-bottom:12px;">
        <label for="input-nombre">Nombre</label>
        <input type="text" id="input-nombre" autocomplete="off">
      </div>
      <div id="inicio-error" class="error-msg"></div>
      <button type="button" class="btn-submit" onclick="iniciarTurno()">ENTRAR</button>
    </div>
  </div>

  <div id="vista-trabajo" class="main-grid hidden">
    <!-- IZQUIERDA: Pedidos (Mis pedidos + Cola de pedidos) -->
    <section class="panel">
      <div class="pedidos-split">
        <div class="sub-bloque">
          <h2 class="sub-titulo">
            <span>Mis pedidos</span>
            <span id="contador-mios-hoy">Hoy: 0</span>
          </h2>
          <div id="lista-mis-pedidos" class="cola-scroll"></div>
        </div>

        <div class="sub-bloque">
          <h2 class="sub-titulo">
            <span>Cola de pedidos</span>
          </h2>
          <div id="lista-cola-pedidos" class="cola-scroll"></div>
        </div>
      </div>
    </section>

    <!-- DERECHA: Un campo por línea + Teclado numérico al lado -->
    <section class="panel">
      <div class="entrada-y-teclado">
        <div class="campos-verticales">
          <div class="field">
            <label for="input-opc">OPC</label>
            <input type="text" id="input-opc" inputmode="none" pattern="\d{4}" maxlength="4" placeholder="4 últimos dígitos">
          </div>

          <div class="field">
            <label for="input-linea">Línea</label>
            <input type="text" id="input-linea" inputmode="none" pattern="[0-9]*">
          </div>

          <div id="bloque-tipo-material" class="field hidden">
            <label for="select-clase-mat">Material</label>
            <select id="select-clase-mat" onchange="alCambiarClaseMaterial()">
              <option value=""></option>
              <option value="lámina">lámina</option>
              <option value="interior">interior</option>
              <option value="posicionador">posicionador</option>
              <option value="sin estuchar">sin estuchar</option>
              <option value="sin encelofanar">sin encelofanar</option>
              <option value="estuche">estuche</option>
              <option value="embalaje">embalaje</option>
              <option value="embalaje inner">embalaje inner</option>
              <option value="otro">otro</option>
            </select>
          </div>

          <div id="campo-otro-mat" class="field hidden">
            <label for="input-otro-mat">Material (otro)</label>
            <input type="text" id="input-otro-mat" enterkeyhint="done">
          </div>

          <div class="field">
            <label>Referencia</label>
            <div class="st-mp-pt-row">
              <button type="button" class="mat-pill" data-mat="ST" onclick="seleccionarPrefijo('ST')">ST</button>
              <button type="button" class="mat-pill" data-mat="MP" onclick="seleccionarPrefijo('MP')">MP</button>
              <button type="button" class="mat-pill" data-mat="PT" onclick="seleccionarPrefijo('PT')">PT</button>
            </div>
            <div id="box-num-ref" class="num-locked-box">
              <span id="prefijo-fijo-span" class="prefijo-fijo hidden"></span>
              <input type="text" id="input-num-ref" inputmode="none" pattern="[0-9]*">
            </div>
          </div>

          <div class="field">
            <label for="input-lote">Lote</label>
            <input type="text" id="input-lote" enterkeyhint="done">
          </div>

          <div class="field">
            <label for="select-tiempo">Lo necesito en...</label>
            <select id="select-tiempo" onchange="alCambiarTiempo()">
              <option value=""></option>
              <option value="15 min">15 min</option>
              <option value="30 min">30 min</option>
              <option value="1 hora">1 hora</option>
              <option value="2 horas">2 horas</option>
              <option value="+ de 2 horas">+ de 2 horas</option>
            </select>
          </div>

          <div id="campo-cantidad" class="field hidden">
            <label for="input-cantidad">Cantidad</label>
            <input type="text" id="input-cantidad" inputmode="none" pattern="[0-9]*" value="1">
          </div>
        </div>

        <div class="fixed-numpad" aria-label="Teclado numérico fijo">
          <div class="numpad-header">
            <span>Teclado numérico</span>
            <span id="numpad-campo-label">Escribiendo en: OPC</span>
          </div>
          <div class="numpad-grid">
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '1')">1</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '2')">2</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '3')">3</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '4')">4</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '5')">5</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '6')">6</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '7')">7</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '8')">8</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '9')">9</button>
            <button type="button" class="num-key key-clear" onpointerdown="limpiarCampoNumerico(event)">C</button>
            <button type="button" class="num-key" onpointerdown="pulsarNumero(event, '0')">0</button>
            <button type="button" class="num-key key-del" onpointerdown="borrarNumero(event)">⌫</button>
          </div>
        </div>
      </div>

      <div id="form-error" class="error-msg"></div>
      <button type="button" class="btn-submit" id="btn-guardar" onclick="guardarPedido()">SOLICITAR</button>
      <button type="button" id="btn-cancelar-edicion" class="btn-cancel-edit hidden" onclick="cancelarEdicion()">Cancelar edición</button>
    </section>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zblcwahdurlmnlkjocfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zPaFGK04be_flVvEGmaepw_YMZq9Wxn';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  localStorage.removeItem('colaOfflineOperaria');

  let sesionOp = JSON.parse(
    localStorage.getItem('sesionOperariaNombre') ||
    sessionStorage.getItem('sesionOperariaNombre') ||
    'null'
  );
  if (sesionOp && sesionOp.nombre) {
    localStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
  } else {
    sesionOp = null;
  }

  let prefijoSeleccionado = '';
  let idEditando = null;
  let pedidosHoyTodos = [];
  let peticionesHoyNombre = [];
  let idsListosAvisados = new Set();
  let primeraCargaOp = true;
  let colaOffline = [];
  let cargando = false;
  let audioCtxOp = null;
  let estaOnlineOp = navigator.onLine;
  let ultimoRenderOp = '';

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function inicioHoyISO() {
    const ahora = new Date();
    const inicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), 0, 0, 0, 0);
    return inicio.toISOString();
  }

  function calcularVencimientoMs(opcionTiempo) {
    const minutosMap = {
      '15 min': 15,
      '30 min': 30,
      '1 hora': 60,
      '2 horas': 120,
      '+ de 2 horas': 121
    };
    const mins = minutosMap[opcionTiempo];
    if (!mins) return null;
    return Date.now() + mins * 60000;
  }

  function codificarMetaEnMaterial(resumenBase, tiempoSel, cantidadNum, puestosNum = 0, venceMsOverride = null) {
    const limpio = String(resumenBase || 'Pedido').replace(/\s*\[\[META:[^\]]+\]\]\s*$/g, '').trim() || 'Pedido';
    const venceMs = tiempoSel ? (venceMsOverride || calcularVencimientoMs(tiempoSel)) : null;
    const cant = Math.max(1, parseInt(cantidadNum, 10) || 1);
    const puestos = Math.max(0, Math.min(cant, parseInt(puestosNum, 10) || 0));
    const meta = {
      t: tiempoSel || null,
      v: venceMs || null,
      c: cant,
      u: puestos
    };
    return `${limpio} [[META:${btoa(unescape(encodeURIComponent(JSON.stringify(meta))))}]]`;
  }

  function decodificarPedidoConMeta(p) {
    const rawMat = String(p?.material || '');
    const match = rawMat.match(/\[\[META:([^\]]+)\]\]\s*$/);
    let meta = { t: null, v: null, c: 1, u: 0 };
    let materialLimpio = rawMat.trim();
    if (match) {
      materialLimpio = rawMat.replace(/\[\[META:[^\]]+\]\]\s*$/g, '').trim();
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(match[1].trim()))));
        const cantParseada = Math.max(1, parseInt(parsed.c, 10) || 1);
        const rawU = Math.max(0, parseInt(parsed.u, 10) || 0);
        const puestosParseados = p.estado === 'completado'
          ? cantParseada
          : Math.min(cantParseada, rawU);
        meta = {
          t: parsed.t || null,
          v: parsed.v ? Number(parsed.v) : null,
          c: cantParseada,
          u: puestosParseados
        };
      } catch (_) {}
    } else if (p?.estado === 'completado') {
      meta.u = 1;
    }

    const estadoEfectivo = (p.estado === 'completado' || meta.u >= meta.c)
      ? 'completado'
      : p.estado;

    return {
      ...p,
      estado: estadoEfectivo,
      material_limpio: materialLimpio,
      tiempo_aviso: p.tiempo_aviso || meta.t,
      vence_en: p.vence_en || (meta.v ? new Date(meta.v).toISOString() : null),
      vence_ms: p.vence_en ? new Date(p.vence_en).getTime() : meta.v,
      cantidad: Math.max(1, parseInt(meta.c || p.cantidad || 1, 10) || 1),
      puestos: estadoEfectivo === 'completado' ? Math.max(1, parseInt(meta.c || p.cantidad || 1, 10) || 1) : meta.u
    };
  }

  function esPedidoConTiempo(p) {
    return Boolean(p && (p.tiempo_aviso || p.vence_ms));
  }

  function haVencidoTiempoPedido(p) {
    if (!esPedidoConTiempo(p)) return true;
    const ms = p.vence_ms || (p.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return true;
    return Date.now() >= ms;
  }

  function formatearHoraVencimiento(p) {
    const ms = p?.vence_ms || (p?.vence_en ? new Date(p.vence_en).getTime() : null);
    if (!ms || Number.isNaN(ms)) return '';
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function hacerScrollArribaPedidosSiProcede() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.cola-scroll').forEach(el => {
        if (el.scrollTop > 0) el.scrollTop = 0;
      });
    });
  }

  function sonarPitidoFuerteOp() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioCtxOp) {
        audioCtxOp = new AudioCtx();
      }
      if (audioCtxOp.state === 'suspended') {
        audioCtxOp.resume().catch(() => {});
      }
      const ahora = audioCtxOp.currentTime;
      const tonos = [
        [987, ahora, 0.2],
        [1318, ahora + 0.22, 0.25]
      ];
      tonos.forEach(([freq, start, dur]) => {
        const osc = audioCtxOp.createOscillator();
        const gain = audioCtxOp.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.45, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtxOp.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      });
    } catch (_) {}
  }

  function solicitarPermisoNotificacionEnSegundoPlano() {
    try {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }
    } catch (_) {}
  }

  function notificarPedidoListo(titulo, cuerpo) {
    sonarPitidoFuerteOp();
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(titulo, {
              body: cuerpo,
              tag: 'pedido-listo-op',
              renotify: true
            });
          }).catch(() => {
            new Notification(titulo, { body: cuerpo });
          });
        } else {
          new Notification(titulo, { body: cuerpo });
        }
      }
    } catch (_) {}
  }

  function iniciarTurno() {
    const inputEl = document.getElementById('input-nombre');
    const nombre = (inputEl ? inputEl.value : '').trim();
    const err = document.getElementById('inicio-error');
    if (!nombre) {
      if (err) err.innerText = 'Escribe tu nombre.';
      return;
    }
    if (err) err.innerText = '';
    sesionOp = { nombre: nombre };
    try {
      localStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
      sessionStorage.setItem('sesionOperariaNombre', JSON.stringify(sesionOp));
    } catch (_) {}

    mostrarTrabajo();
    sonarPitidoFuerteOp();
    solicitarPermisoNotificacionEnSegundoPlano();
  }

  function salirTurno() {
    try {
      localStorage.removeItem('sesionOperariaNombre');
      sessionStorage.removeItem('sesionOperariaNombre');
    } catch (_) {}
    sesionOp = null;
    primeraCargaOp = true;
    idsListosAvisados.clear();
    ultimoRenderOp = '';
    cancelarEdicion();
    document.getElementById('vista-trabajo').classList.add('hidden');
    document.getElementById('vista-inicio').classList.remove('hidden');
    document.getElementById('user-badge').classList.add('hidden');
    document.getElementById('btn-cambiar').classList.add('hidden');
  }

  function mostrarTrabajo() {
    if (!sesionOp) return;
    document.getElementById('vista-inicio').classList.add('hidden');
    document.getElementById('vista-trabajo').classList.remove('hidden');
    const badge = document.getElementById('user-badge');
    badge.classList.remove('hidden');
    badge.innerText = sesionOp.nombre;
    document.getElementById('btn-cambiar').classList.remove('hidden');
    seleccionarCampoNumerico(inputOpc);
    cargarPedidos();
  }

  function cerrarTecladoAlAceptar(inputEl) {
    if (!inputEl) return;
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        inputEl.blur();
      }
    });
  }

  const inputNombreInicio = document.getElementById('input-nombre');
  if (inputNombreInicio) {
    inputNombreInicio.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        iniciarTurno();
      }
    });
  }

  const inputOpc = document.getElementById('input-opc');
  const inputLinea = document.getElementById('input-linea');
  const inputNumRef = document.getElementById('input-num-ref');
  const inputOtroMat = document.getElementById('input-otro-mat');
  const inputLote = document.getElementById('input-lote');
  const selectTiempo = document.getElementById('select-tiempo');
  const inputCantidad = document.getElementById('input-cantidad');
  const prefijoSpan = document.getElementById('prefijo-fijo-span');
  const boxNumRef = document.getElementById('box-num-ref');

  [inputOtroMat, inputLote].forEach(cerrarTecladoAlAceptar);

  const CAMPOS_NUMERICOS = [
    { el: inputOpc, nombre: 'OPC', maxLen: 4 },
    { el: inputLinea, nombre: 'Línea', maxLen: 4 },
    { el: inputNumRef, nombre: 'Referencia', maxLen: 12 },
    { el: inputCantidad, nombre: 'Cantidad', maxLen: 3 }
  ];
  let campoNumericoActivo = inputOpc;
  let reemplazarEnSiguienteToque = false;

  function seleccionarCampoNumerico(el, reemplazarInicial = false) {
    if (!el) return;
    campoNumericoActivo = el;
    reemplazarEnSiguienteToque = Boolean(reemplazarInicial);

    CAMPOS_NUMERICOS.forEach(item => {
      item.el.classList.toggle('keypad-target-active', item.el === el);
    });
    if (boxNumRef) {
      boxNumRef.classList.toggle('keypad-box-active', el === inputNumRef);
    }

    const meta = CAMPOS_NUMERICOS.find(item => item.el === el);
    const lbl = document.getElementById('numpad-campo-label');
    if (lbl && meta) {
      lbl.textContent = `Escribiendo en: ${meta.nombre}`;
    }
  }

  CAMPOS_NUMERICOS.forEach(item => {
    item.el.addEventListener('focus', () => {
      seleccionarCampoNumerico(item.el, item.el === inputCantidad);
    });
    item.el.addEventListener('pointerdown', () => {
      seleccionarCampoNumerico(item.el, item.el === inputCantidad);
    });
    item.el.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, item.maxLen);
      if (item.el === inputOpc || item.el === inputNumRef) {
        actualizarVisibilidadClaseMaterial();
      }
    });
  });

  function sincronizarCambioCampoNumerico(el) {
    if (el === inputOpc || el === inputNumRef) {
      actualizarVisibilidadClaseMaterial();
    }
    if (el === inputOpc && inputOpc.value.length === 4) {
      seleccionarCampoNumerico(inputLinea);
      inputLinea.focus();
    }
  }

  function pulsarNumero(ev, digito) {
    if (ev) ev.preventDefault();
    const target = (campoNumericoActivo && !campoNumericoActivo.closest('.hidden'))
      ? campoNumericoActivo
      : inputOpc;

    seleccionarCampoNumerico(target, false);
    const meta = CAMPOS_NUMERICOS.find(item => item.el === target);
    const maxLen = meta ? meta.maxLen : 10;

    let actual = target.value.replace(/\D/g, '');
    if (reemplazarEnSiguienteToque) {
      actual = '';
      reemplazarEnSiguienteToque = false;
    }
    if (actual.length >= maxLen) return;

    target.value = actual + digito;
    target.focus();
    sincronizarCambioCampoNumerico(target);
  }

  function borrarNumero(ev) {
    if (ev) ev.preventDefault();
    const target = (campoNumericoActivo && !campoNumericoActivo.closest('.hidden'))
      ? campoNumericoActivo
      : inputOpc;

    seleccionarCampoNumerico(target, false);
    const actual = target.value.replace(/\D/g, '');
    target.value = actual.slice(0, -1);
    target.focus();
    sincronizarCambioCampoNumerico(target);
  }

  function limpiarCampoNumerico(ev) {
    if (ev) ev.preventDefault();
    const target = (campoNumericoActivo && !campoNumericoActivo.closest('.hidden'))
      ? campoNumericoActivo
      : inputOpc;

    seleccionarCampoNumerico(target, false);
    target.value = (target === inputCantidad) ? '1' : '';
    if (target === inputCantidad) reemplazarEnSiguienteToque = true;
    target.focus();
    sincronizarCambioCampoNumerico(target);
  }

  function alCambiarTiempo() {
    const valTiempo = selectTiempo.value;
    const campoCant = document.getElementById('campo-cantidad');
    const tieneTiempo = Boolean(valTiempo);
    campoCant.classList.toggle('hidden', !tieneTiempo);
    if (tieneTiempo) {
      if (!inputCantidad.value || Number(inputCantidad.value) < 1) {
        inputCantidad.value = '1';
      }
      seleccionarCampoNumerico(inputCantidad, true);
    } else if (campoNumericoActivo === inputCantidad) {
      seleccionarCampoNumerico(inputOpc);
    }
  }

  function tieneReferenciaCompleta() {
    return Boolean(prefijoSeleccionado && inputNumRef.value.trim());
  }

  function actualizarPrefijoVisual() {
    if (prefijoSeleccionado) {
      prefijoSpan.textContent = `${prefijoSeleccionado}-`;
      prefijoSpan.classList.remove('hidden');
    } else {
      prefijoSpan.textContent = '';
      prefijoSpan.classList.add('hidden');
    }
  }

  function seleccionarPrefijo(pref) {
    prefijoSeleccionado = (prefijoSeleccionado === pref) ? '' : pref;
    document.querySelectorAll('.mat-pill').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mat === prefijoSeleccionado);
    });
    actualizarPrefijoVisual();
    actualizarVisibilidadClaseMaterial();
    seleccionarCampoNumerico(inputNumRef);
    inputNumRef.focus();
  }

  function actualizarVisibilidadClaseMaterial() {
    const tieneOpc = Boolean(inputOpc.value.trim());
    const pedirMaterial = tieneOpc && !tieneReferenciaCompleta();
    document.getElementById('bloque-tipo-material').classList.toggle('hidden', !pedirMaterial);
    if (!pedirMaterial) {
      document.getElementById('select-clase-mat').value = '';
      inputOtroMat.value = '';
      document.getElementById('campo-otro-mat').classList.add('hidden');
    }
  }

  function alCambiarClaseMaterial() {
    const sel = document.getElementById('select-clase-mat').value;
    const esOtro = sel === 'otro';
    document.getElementById('campo-otro-mat').classList.toggle('hidden', !esOtro);
    if (esOtro) {
      inputOtroMat.focus();
    }
  }

  function obtenerClaseMaterialFinal() {
    const sel = document.getElementById('select-clase-mat').value;
    if (sel === 'otro') return inputOtroMat.value.trim();
    return sel.trim();
  }

  function actualizarEstadoRed(online) {
    estaOnlineOp = Boolean(online);
    const badge = document.getElementById('network-status');
    const txt = estaOnlineOp ? '● Conectado' : '● Sin cobertura';
    const cls = estaOnlineOp ? 'pill-status' : 'pill-status offline';
    if (badge.innerText !== txt) badge.innerText = txt;
    if (badge.className !== cls) badge.className = cls;
  }

  function limpiarFormulario() {
    idEditando = null;
    document.getElementById('btn-guardar').innerText = 'SOLICITAR';
    document.getElementById('btn-cancelar-edicion').classList.add('hidden');
    inputOpc.value = '';
    inputNumRef.value = '';
    inputLote.value = '';
    inputOtroMat.value = '';
    selectTiempo.value = '';
    inputCantidad.value = '1';
    document.getElementById('campo-cantidad').classList.add('hidden');
    document.getElementById('select-clase-mat').value = '';
    document.getElementById('campo-otro-mat').classList.add('hidden');
    document.getElementById('bloque-tipo-material').classList.add('hidden');
    prefijoSeleccionado = '';
    actualizarPrefijoVisual();
    document.querySelectorAll('.mat-pill').forEach(b => b.classList.remove('active'));
    document.getElementById('form-error').innerText = '';
    seleccionarCampoNumerico(inputOpc);
  }

  function cancelarEdicion() {
    limpiarFormulario();
  }

  function editarPedidoPorId(id) {
    const pedido = pedidosHoyTodos.find(item => String(item.id) === String(id));
    if (pedido) empezarEdicion(pedido);
  }

  function empezarEdicion(pedido) {
    idEditando = pedido.id;
    document.getElementById('btn-guardar').innerText = 'GUARDAR CAMBIOS';
    document.getElementById('btn-cancelar-edicion').classList.remove('hidden');

    inputLinea.value = (pedido.linea || '').replace(/\D/g, '') || inputLinea.value;
    inputOpc.value = pedido.opc || '';
    inputNumRef.value = pedido.num_referencia || '';
    inputLote.value = (pedido.lote && pedido.lote !== 'FIFO') ? pedido.lote : '';
    selectTiempo.value = pedido.tiempo_aviso || '';
    inputCantidad.value = pedido.cantidad || 1;
    alCambiarTiempo();

    prefijoSeleccionado = pedido.tipo_material || '';
    actualizarPrefijoVisual();
    document.querySelectorAll('.mat-pill').forEach(b => {
      b.classList.toggle('active', b.dataset.mat === prefijoSeleccionado);
    });

    actualizarVisibilidadClaseMaterial();
    const claseGuardada = pedido.clase_material || '';
    const opcionesPredefinidas = ['lámina','interior','posicionador','sin estuchar','sin encelofanar','estuche','embalaje','embalaje inner'];
    if (claseGuardada && !document.getElementById('bloque-tipo-material').classList.contains('hidden')) {
      if (opcionesPredefinidas.includes(claseGuardada)) {
        document.getElementById('select-clase-mat').value = claseGuardada;
        document.getElementById('campo-otro-mat').classList.add('hidden');
      } else {
        document.getElementById('select-clase-mat').value = 'otro';
        document.getElementById('campo-otro-mat').classList.remove('hidden');
        inputOtroMat.value = claseGuardada;
      }
    }
    seleccionarCampoNumerico(inputOpc);
  }

  function claveMaterial(item) {
    const tipo = (item.tipo_material || '').toUpperCase();
    const num = (item.num_referencia || '').trim();
    const clase = (item.clase_material || '').trim().toLowerCase();
    const opc = (item.opc || '').trim();
    const lote = (item.lote || 'FIFO').trim().toUpperCase();
    return `${tipo}|${num}|${clase}|${opc}|${lote}`;
  }

  function buscarMaterialRegistrado(nombreSolicitante, candidato, excluirId = null) {
    const claveNueva = claveMaterial(candidato);
    const activosMios = pedidosHoyTodos.filter(
      p => p.estado !== 'completado' &&
           (p.solicitado_por || '').toLowerCase() === nombreSolicitante.toLowerCase() &&
           p.id !== excluirId
    );
    const enColaLocal = colaOffline.filter(
      p => (p.solicitado_por || '').toLowerCase() === nombreSolicitante.toLowerCase()
    );
    return [...activosMios, ...enColaLocal].find(p => claveMaterial(p) === claveNueva) || null;
  }

  async function guardarPedido() {
    const err = document.getElementById('form-error');
    const numLinea = inputLinea.value.trim();
    const opc = inputOpc.value.trim();
    const numRef = inputNumRef.value.trim();
    const loteInput = inputLote.value.trim();
    const tiempoSel = selectTiempo.value.trim();
    const cantidadNum = tiempoSel ? Math.max(1, parseInt(inputCantidad.value, 10) || 1) : 1;

    if (!numLinea) {
      err.innerText = 'Indica la línea.';
      seleccionarCampoNumerico(inputLinea);
      return;
    }

    const tieneOpc = Boolean(opc);
    const refCompleta = tieneReferenciaCompleta();
    const tieneRefParcial = Boolean(numRef || prefijoSeleccionado);

    if (!tieneOpc && !tieneRefParcial) {
      err.innerText = 'Indica OPC o Referencia.';
      seleccionarCampoNumerico(inputOpc);
      return;
    }

    if (tieneOpc && opc.length !== 4) {
      err.innerText = 'La OPC debe tener 4 números.';
      seleccionarCampoNumerico(inputOpc);
      return;
    }

    if (tieneRefParcial && !refCompleta) {
      err.innerText = 'Completa ST, MP o PT y el número.';
      seleccionarCampoNumerico(inputNumRef);
      return;
    }

    let claseMaterial = '';
    if (tieneOpc && !refCompleta) {
      claseMaterial = obtenerClaseMaterialFinal();
      if (!claseMaterial) {
        err.innerText = 'Indica el material.';
        return;
      }
    }

    const nombreOp = sesionOp ? sesionOp.nombre : 'Operaria';
    const lineaTexto = `Línea ${numLinea}`;
    const refTexto = refCompleta ? `${prefijoSeleccionado}-${numRef}` : '';
    const resumenBase = [refTexto, opc ? `OPC ${opc}` : '', claseMaterial]
      .filter(Boolean)
      .join(' · ') || 'Pedido';

    const existenteEdit = idEditando ? pedidosHoyTodos.find(x => x.id === idEditando) : null;
    const rawPuestosPrevios = existenteEdit ? Math.max(0, parseInt(existenteEdit.puestos, 10) || 0) : 0;
    const yaCompletadoAlEditar = Boolean(existenteEdit && rawPuestosPrevios >= cantidadNum);
    const puestosFinales = yaCompletadoAlEditar ? cantidadNum : Math.min(cantidadNum, rawPuestosPrevios);
    const venceMsPrevio = (existenteEdit && existenteEdit.tiempo_aviso === tiempoSel) ? existenteEdit.vence_ms : null;

    const payload = {
      linea: lineaTexto,
      material: codificarMetaEnMaterial(resumenBase, tiempoSel, cantidadNum, puestosFinales, venceMsPrevio),
      solicitado_por: nombreOp,
      opc: opc || null,
      tipo_material: refCompleta ? prefijoSeleccionado : null,
      num_referencia: refCompleta ? numRef : null,
      clase_material: claseMaterial || null,
      lote: loteInput || 'FIFO',
      estado: yaCompletadoAlEditar ? 'completado' : 'pendiente',
      creado_en: existenteEdit?.creado_en || new Date().toISOString()
    };

    const duplicado = buscarMaterialRegistrado(nombreOp, payload, idEditando);
    if (duplicado) {
      if (!estaOnlineOp || colaOffline.length > 0) {
        err.innerText = 'Ya tienes ese mismo material pedido.';
        return;
      }
      if (!tiempoSel) {
        err.innerText = 'Este material ya está registrado: debes asignar el tiempo en "Lo necesito en..." para volver a pedirlo.';
        return;
      }
    }

    err.innerText = '';
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;

    const eraNuevo = !idEditando;

    if (idEditando) {
      const { error } = await db.from('pedidos').update(payload).eq('id', idEditando);
      if (error) {
        actualizarEstadoRed(false);
        err.innerText = `Error: ${error.message}`;
      } else {
        actualizarEstadoRed(true);
        limpiarFormulario();
        await cargarPedidos();
      }
    } else {
      const { error } = await db.from('pedidos').insert([payload]);
      if (error) {
        colaOffline.push(payload);
        actualizarEstadoRed(false);
        err.innerText = `Sin conexión (${error.message}).`;
      } else {
        actualizarEstadoRed(true);
        limpiarFormulario();
        await cargarPedidos();
        if (eraNuevo) {
          hacerScrollArribaPedidosSiProcede();
        }
      }
    }

    setTimeout(() => {
      btn.disabled = false;
    }, 350);
  }

  async function cancelarPedido(id) {
    if (!confirm('¿Seguro que quieres cancelar este pedido?')) return;
    const { error } = await db.from('pedidos').update({ estado: 'cancelado' }).eq('id', id);
    if (!error) {
      if (idEditando === id) limpiarFormulario();
      await cargarPedidos();
    } else {
      actualizarEstadoRed(false);
    }
  }

  setInterval(async () => {
    if (colaOffline.length === 0) return;
    const pendiente = colaOffline[0];
    const { error } = await db.from('pedidos').insert([pendiente]);
    if (!error) {
      colaOffline.shift();
      actualizarEstadoRed(true);
      await cargarPedidos();
    }
  }, 5000);

  async function cargarPedidos() {
    if (!sesionOp || cargando) return;
    cargando = true;
    try {
      const { data: hoyPedidos, error } = await db
        .from('pedidos')
        .select('*')
        .neq('estado', 'cancelado')
        .gte('creado_en', inicioHoyISO())
        .order('creado_en', { ascending: false });

      if (!error && hoyPedidos) {
        const normalizados = hoyPedidos.map(decodificarPedidoConMeta);
        for (const p of normalizados) {
          if (p.estado === 'completado' && p.puestos >= p.cantidad) {
            const raw = hoyPedidos.find(r => r.id === p.id);
            if (raw && raw.estado !== 'completado') {
              await db.from('pedidos').update({
                estado: 'completado',
                material: codificarMetaEnMaterial(p.material_limpio, p.tiempo_aviso, p.cantidad, p.cantidad, p.vence_ms)
              }).eq('id', p.id);
            }
          }
        }

        const nombreActual = sesionOp.nombre.toLowerCase();
        const miosListos = normalizados.filter(
          p => p.estado === 'completado' &&
               (p.solicitado_por || '').toLowerCase() === nombreActual &&
               haVencidoTiempoPedido(p)
        );

        if (!primeraCargaOp) {
          miosListos.forEach(p => {
            if (!idsListosAvisados.has(p.id)) {
              notificarPedidoListo(
                `Pedido listo · ${p.linea}`,
                formatearDetallePedido(p)
              );
            }
          });
        }

        const idsListosActuales = new Set(miosListos.map(p => p.id));
        idsListosAvisados = new Set([...idsListosAvisados].filter(id => idsListosActuales.has(id)));
        miosListos.forEach(p => idsListosAvisados.add(p.id));
        primeraCargaOp = false;

        pedidosHoyTodos = normalizados;
        peticionesHoyNombre = normalizados.filter(
          p => (p.solicitado_por || '').toLowerCase() === nombreActual
        );
        renderizarTodo();
        actualizarEstadoRed(true);
      } else if (error) {
        actualizarEstadoRed(false);
      }
    } finally {
      cargando = false;
    }
  }

  function formatearDetallePedido(p) {
    const refFmt = p.num_referencia ? (p.tipo_material ? `${p.tipo_material}-${p.num_referencia}` : p.num_referencia) : '';
    const cant = Math.max(1, Number(p.cantidad) || 1);
    const cantTxt = cant > 1 ? `Cantidad: ${cant}` : '';
    const partes = [refFmt, p.opc ? `OPC ${p.opc}` : '', p.clase_material || '', cantTxt].filter(Boolean);
    return partes.length > 0 ? partes.join(' · ') : (p.material_limpio || p.material || 'Material');
  }

  function pintarTarjetaPedido(p, idx, esMio) {
    const esListo = p.estado === 'completado';
    const hora = new Date(p.creado_en).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const detalle = formatearDetallePedido(p);
    const loteTxt = (p.lote && p.lote !== 'FIFO') ? `Lote ${p.lote}` : 'FIFO';
    const sub = [loteTxt, hora, p.solicitado_por || ''].filter(Boolean).join(' · ');
    const estadoTxt = esListo ? 'Listo' : 'Pendiente';
    const horaVence = formatearHoraVencimiento(p);
    const cant = Math.max(1, Number(p.cantidad) || 1);
    const puestos = esListo ? cant : Math.max(0, Math.min(cant, Number(p.puestos) || 0));
    const progresoHtml = cant > 1
      ? `<div class="pedido-progreso">Cantidad pedida: ${cant} · Puestos ya: ${puestos} / ${cant}</div>`
      : '';

    return `
      <div class="pedido-card ${p.estado} ${esMio ? 'es-mio' : ''}">
        <div>
          <div class="pedido-main">#${idx + 1} · ${p.linea} — ${detalle}</div>
          <div class="pedido-sub">${sub}</div>
          ${progresoHtml}
          <div>
            ${esMio ? '<span class="tag mio">Mío</span>' : ''}
            <span class="tag ${p.estado}">${estadoTxt}</span>
            ${p.tiempo_aviso ? `<span class="tag tiempo">${p.tiempo_aviso}${horaVence ? ` (${horaVence})` : ''}</span>` : ''}
          </div>
        </div>
        ${(esMio && !esListo) ? `
          <div class="acciones-card">
            <button type="button" class="btn-mini btn-mod" onclick="editarPedidoPorId(${p.id})">Modificar</button>
            <button type="button" class="btn-mini btn-can" onclick="cancelarPedido(${p.id})">Cancelar</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderizarTodo() {
    const listaMios = document.getElementById('lista-mis-pedidos');
    const listaCola = document.getElementById('lista-cola-pedidos');
    const contadorEl = document.getElementById('contador-mios-hoy');
    const nombreActual = (sesionOp?.nombre || '').toLowerCase();

    const misPedidos = pedidosHoyTodos.filter(
      p => nombreActual && (p.solicitado_por || '').toLowerCase() === nombreActual
    );

    const colaPedidos = pedidosHoyTodos.filter(p => {
      const esMio = nombreActual && (p.solicitado_por || '').toLowerCase() === nombreActual;
      if (p.estado === 'completado') return false;
      if (esPedidoConTiempo(p) && !esMio && !haVencidoTiempoPedido(p)) return false;
      return true;
    });

    const contadorTxt = `Hoy: ${peticionesHoyNombre.length}`;
    if (contadorEl.innerText !== contadorTxt) {
      contadorEl.innerText = contadorTxt;
    }

    const minutoClave = Math.floor(Date.now() / 60000);
    const firma = JSON.stringify({
      m: minutoClave,
      mios: misPedidos.map(p => [p.id, p.estado, p.material, p.lote, p.linea, p.puestos, p.cantidad]),
      cola: colaPedidos.map(p => [p.id, p.estado, p.material, p.lote, p.linea, p.solicitado_por, p.puestos, p.cantidad])
    });
    if (firma === ultimoRenderOp) return;
    ultimoRenderOp = firma;

    listaMios.innerHTML = misPedidos.length === 0
      ? '<div style="color:var(--muted); font-weight:800; font-size:0.88rem;">Sin pedidos tuyos hoy.</div>'
      : misPedidos.map((p, idx) => pintarTarjetaPedido(p, idx, true)).join('');

    listaCola.innerHTML = colaPedidos.length === 0
      ? '<div style="color:var(--muted); font-weight:800; font-size:0.88rem;">Sin pedidos en cola.</div>'
      : colaPedidos.map((p, idx) => {
          const esMio = nombreActual && (p.solicitado_por || '').toLowerCase() === nombreActual;
          return pintarTarjetaPedido(p, idx, esMio);
        }).join('');
  }

  window.addEventListener('online', () => {
    actualizarEstadoRed(true);
    cargarPedidos();
  });
  window.addEventListener('offline', () => {
    actualizarEstadoRed(false);
  });

  db.channel('cambios-pedidos-op-global')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
      cargarPedidos();
    })
    .subscribe();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sesionOp) {
      ultimoRenderOp = '';
      cargarPedidos();
    }
  });

  setInterval(() => {
    if (sesionOp && document.visibilityState === 'visible') {
      renderizarTodo();
      cargarPedidos();
    }
  }, 6500);

  if (sesionOp) {
    mostrarTrabajo();
  }
</script>
</body>
</html>
